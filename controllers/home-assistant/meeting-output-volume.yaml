# Merge into Home Assistant's scripts configuration, or include as a package.
# Requires rest_command.work_macbook to call the Work Mac's BTT named triggers.
script:
  work_mac_hidock_volume_up:
    alias: Work Mac - HiDock H1 output volume up
    mode: queued
    max: 20
    sequence:
      - action: rest_command.work_macbook
        data:
          trigger: work_mac_hidock_volume_up
  work_mac_hidock_volume_down:
    alias: Work Mac - HiDock H1 output volume down
    mode: queued
    max: 20
    sequence:
      - action: rest_command.work_macbook
        data:
          trigger: work_mac_hidock_volume_down
