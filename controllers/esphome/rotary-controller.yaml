          if (id(media_title).state.empty())
            lv_label_set_text(id(media_album_label), id(last_media_title).empty()
                                                     ? "No recent item"
                                                     : id(last_media_title).c_str());
          else
            lv_label_set_text(id(media_album_label), x.c_str());
      - script.execute: refresh_music_synopsis

  - platform: homeassistant
