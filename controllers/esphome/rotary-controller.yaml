# Native panel memory is 450x600 portrait. This places the physical side keys
# across the top when the unit is turned counterclockwise as requested.
display:
  - platform: mipi_spi
    id: amoled_display
    model: JC3636W518V2
    spi_id: display_qspi
    data_rate: 40MHz
    cs_pin: GPIO14
    reset_pin: GPIO21
    color_order: rgb
    invert_colors: true
    dimensions:
      width: 360
      height: 360
    auto_clear_enabled: false
    update_interval: never

light:
  - platform: monochromatic
    id: amoled_brightness
    name: AMOLED Brightness
    output: display_backlight_pwm
    restore_mode: ALWAYS_ON
    gamma_correct: 1.0
    default_transition_length: 150ms

touchscreen:
  - platform: cst816
    id: controller_touch
    i2c_id: touch_bus
    display: amoled_display
    interrupt_pin:
      number: GPIO9
      allow_other_uses: true
    reset_pin: GPIO10
    transform:
      mirror_x: false
      mirror_y: false
      swap_xy: false
    on_touch:
      - script.execute: set_cpu_interactive
      - lambda: |-
          id(network_activity_until_ms) = millis() + 900U;
          lv_obj_clear_flag(id(top_network_activity), LV_OBJ_FLAG_HIDDEN);
          if (!id(screen_sleeping)) {
            // LVGL rotates the rendered display 180 degrees, while this
            // callback receives the controller's raw coordinates. Physical
            // top is therefore the high-Y edge.
            id(top_drawer_touch_active)=id(control_drawer_open) || (touch.y<=52 || touch.y>=308);
            id(top_drawer_touch_start_y)=touch.y;
            id(top_drawer_touch_last_y)=touch.y;
          }
      - if:
          condition:
            lambda: 'return id(screen_sleeping) && !id(manual_power_off) && id(wake_on_touch).state;'
          then:
            - light.turn_on:
                id: amoled_brightness
                brightness: !lambda 'return id(display_brightness).state / 100.0f;'
          else:
            - lambda: 'id(last_activity_ms) = millis();'
    on_update:
      - lambda: |-
          if(id(top_drawer_touch_active) && !touches.empty())
            id(top_drawer_touch_last_y)=touches[0].y;
    on_release:
      - if:
          condition:
            lambda: 'return id(screen_sleeping) && !id(manual_power_off) && id(wake_on_touch).state;'
          then:
            - script.execute: wake_screen
          else:
            - if:
                condition:
                  lambda: 'return !id(screen_sleeping);'
                then:
                  - lambda: 'id(last_activity_ms) = millis();'
                  - if:
                      condition:
                        lambda: |-
                          // At 180 degrees a physical upward dismissal raises
                          // raw Y; a downward pull from the top lowers it.
                          const int delta=id(top_drawer_touch_last_y)-id(top_drawer_touch_start_y);
                          const bool close=id(control_drawer_open) && delta>=48;
                          const bool open=!id(control_drawer_open) && id(top_drawer_touch_active) && abs(delta)>=48;
                          id(top_drawer_touch_active)=false;
                          if(close) { id(close_control_mode_drawer).execute(); return false; }
                          return open;
                      then:
                        - script.execute: open_control_mode_drawer

