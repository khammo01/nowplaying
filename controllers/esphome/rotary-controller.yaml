    name: Screen Timeout
    unit_of_measurement: s
    min_value: 15
    max_value: 1800
    step: 15
    initial_value: 60
    restore_value: true
    optimistic: true
    entity_category: config

  - platform: template
    id: device_sleep_delay
    name: Sleep After Screen Off
    unit_of_measurement: s
    min_value: 30
    max_value: 3600
    step: 30
    initial_value: 300
    restore_value: true
    optimistic: true
    entity_category: config

  - platform: template
    id: display_brightness
    name: Display Brightness
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 5
    initial_value: 65
    restore_value: true
    optimistic: true
    entity_category: config
    on_value:
      - lambda: |-
          if (!id(brightness_auto_setting)) {
            id(brightness_user_overridden) = true;
            id(brightness_wake_pending) = false;
          }
      - if:
          condition:
            lambda: 'return !id(screen_sleeping);'
          then:
            - light.turn_on:
                id: amoled_brightness
                brightness: !lambda 'return x / 100.0f;'

select:
  - platform: template
    id: haptic_profile_select
    name: Rotary Haptic Feedback
    options: ["Off", "Crisp", "Strong", "Very Strong", "Maximum"]
    initial_option: "Strong"
    restore_value: true
    optimistic: true
    entity_category: config
    on_value:
      - lambda: |-
          if (x == "Off") id(haptic_profile) = 0;
          else if (x == "Crisp") id(haptic_profile) = 1;
          else if (x == "Strong") id(haptic_profile) = 2;
          else if (x == "Very Strong") id(haptic_profile) = 3;
          else id(haptic_profile) = 4;
          id(haptic_preview).execute();

  - platform: template
    id: sleep_depth_select
    name: Sleep Depth
    options:
      - "Display only"
      - "Eco"
      - "Deep"
    initial_option: "Eco"
    restore_value: true
    optimistic: true
    entity_category: config
    on_value:
      - lambda: |-
          if (x == "Display only") id(sleep_depth) = 0;
          else if (x == "Deep") id(sleep_depth) = 2;
          else id(sleep_depth) = 1;

image:
  - platform: online_image
    id: media_artwork
    url: http://homeassistant.local:8123/local/nowplaying/controller-artwork.jpg
    format: JPEG
    type: RGB565
    resize: 112x112
    buffer_size: 65536
    update_interval: never
    on_download_finished:
      - lambda: |-
          lv_image_cache_drop(lv_image_get_src(id(artwork_widget)));
          id(network_activity_until_ms) = millis() + 900U;
          lv_obj_clear_flag(id(top_network_activity), LV_OBJ_FLAG_HIDDEN);
      - lvgl.image.update:
          id: artwork_widget
          src: media_artwork
      - lambda: |-
          id(fresh_artwork_ready) = true;
          id(stop_artwork_placeholder).execute();
          const std::string paired = id(controller_artwork_url).state;
          const bool paired_ready = !paired.empty() && paired != "unknown" && paired != "unavailable";
          const bool allow_legacy_active = id(media_kind).state != "idle";
          if (id(startup_state_ready) && (paired_ready || allow_legacy_active)) {
            lv_obj_add_flag(id(artwork_placeholder), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(artwork_widget), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(artwork_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(artwork_placeholder), LV_OBJ_FLAG_HIDDEN);
          }

