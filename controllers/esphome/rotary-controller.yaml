interval:
  - interval: 10s
    then:
      - if:
          condition:
            lambda: 'return id(work_meeting_active).state && !id(meeting_card_dismissed);'
          then:
            - script.execute: refresh_meeting_mute_state

  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              return id(work_meeting_active).state && !id(meeting_card_dismissed) &&
                     lv_obj_has_flag(id(meeting_overlay), LV_OBJ_FLAG_HIDDEN);
          then:
            - script.execute: refresh_meeting_card
            - lvgl.widget.show: meeting_overlay

  - interval: 250ms
    then:
      - if:
          condition: { lambda: 'return id(ota_preflight_active);' }
          then:
            - lambda: |-
                // Waiting for a build is not an active transfer. Release the
                // overlay if the build was cancelled or never reached us.
                // on_begin clears ota_preflight_active, so a real OTA is untouched.
                if ((uint32_t)(millis() - id(ota_preflight_started_ms)) >= 600000U) {
                  id(ota_preflight_active) = false;
                  lv_obj_add_flag(id(ota_overlay), LV_OBJ_FLAG_HIDDEN);
                  id(last_activity_ms) = millis();
                  id(set_cpu_idle).execute();
                  return;
                }
                id(ota_preflight_phase) = (id(ota_preflight_phase) + 1) % 16;
                const int phase = id(ota_preflight_phase);
                const int progress = phase < 8 ? 10 + phase * 8 : 66 - (phase - 8) * 8;
                const char *dots[] = {"Preparing controller", "Preparing controller.",
                                      "Preparing controller..", "Preparing controller..."};
                lv_label_set_text(id(ota_progress_label), dots[(phase / 2) % 4]);
                lv_bar_set_value(id(ota_progress_bar), progress, LV_ANIM_ON);
  - interval: 1s
    then:
      # An awake UI must never be stranded with its radio disabled. This also
      # repairs an interrupted legacy recovery cycle without overriding the
      # user's explicit Wi-Fi toggle.
      - if:
          condition:
            lambda: |-
              return id(user_wifi_enabled).state &&
                     !wifi::global_wifi_component->is_connected();
          then:
            - wifi.enable:
      - script.execute: render_media_time
      - lambda: |-
          // Sample both FreeRTOS idle tasks once per second. The estimate is
          // frequency-normalized before downshifting: 20% at 240 MHz is about
          // 60% of the available work budget at 80 MHz.
          static TaskStatus_t tasks[48];
          configRUN_TIME_COUNTER_TYPE total = 0;
          const UBaseType_t count = uxTaskGetSystemState(tasks, 48, &total);
          if (count > 0) {
            uint32_t idle0 = 0;
            uint32_t idle1 = 0;
            for (UBaseType_t i = 0; i < count; i++) {
              if (strcmp(tasks[i].pcTaskName, "IDLE0") == 0) idle0 = tasks[i].ulRunTimeCounter;
              else if (strcmp(tasks[i].pcTaskName, "IDLE1") == 0) idle1 = tasks[i].ulRunTimeCounter;
            }
            if (id(cpu_stats_ready)) {
              const uint32_t elapsed = static_cast<uint32_t>(total) - id(cpu_previous_total);
              const uint32_t idle_elapsed = (idle0 - id(cpu_previous_idle0)) +
                                            (idle1 - id(cpu_previous_idle1));
              if (elapsed > 0) {
                const float idle_fraction = idle_elapsed / (elapsed * 2.0f);
                id(cpu_utilization) = std::max(0.0f, std::min(100.0f,
                    100.0f * (1.0f - idle_fraction)));
              }
            }
            id(cpu_previous_total) = static_cast<uint32_t>(total);
            id(cpu_previous_idle0) = idle0;
            id(cpu_previous_idle1) = idle1;
            id(cpu_stats_ready) = true;
          }

          const uint32_t now = millis();
          const bool network_needs_headroom = id(user_wifi_enabled).state &&
              (!wifi::global_wifi_component->is_connected() ||
               !api::global_api_server->is_connected_with_state_subscription());
          if (id(cpu_profile_mhz) <= 80) {
            id(cpu_low_load_streak) = 0;
            // Keep at least 35% spare capacity for rendering, networking, and
            // Home Assistant bursts. One busy sample restores full speed.
            if (network_needs_headroom ||
                (id(cpu_stats_ready) && id(cpu_utilization) >= 65.0f)) {
              id(cpu_boost_hold_until) = now + 12000U;
              id(set_cpu_interactive).execute();
            }
          } else {
            const float estimated_load_at_40 = id(cpu_utilization) *
                (static_cast<float>(id(cpu_profile_mhz)) / 80.0f);
            const bool quiet_enough = id(cpu_stats_ready) && id(startup_state_ready) &&
                !network_needs_headroom &&
                !id(screen_sleeping) && now - id(last_activity_ms) >= 5000U &&
                estimated_load_at_40 <= 50.0f;
            id(cpu_low_load_streak) = quiet_enough
                ? std::min<uint8_t>(3, id(cpu_low_load_streak) + 1) : 0;
            const bool boost_hold_done =
                static_cast<int32_t>(now - id(cpu_boost_hold_until)) >= 0;
            if (id(cpu_low_load_streak) >= 3 && boost_hold_done)
              id(set_cpu_idle).execute();
          }
      - if:
          condition:
            lambda: 'return !id(screen_sleeping);'
          then:
            - script.execute: refresh_playback_status_icon
      - script.execute: show_active_media_when_idle
      - if:
          condition:
            lambda: 'return !id(startup_state_ready);'
          then:
            - lambda: 'id(startup_wait_seconds) = std::min<uint8_t>(60, id(startup_wait_seconds) + 1);'
            - script.execute: refresh_startup_ui
            - if:
                condition:
                  lambda: |-
                    return id(ha_api_ready) &&
                           (id(startup_wait_seconds) == 2 || id(startup_wait_seconds) == 4 ||
                            id(startup_wait_seconds) == 6 || id(startup_wait_seconds) == 8);
                then:
                  - script.execute: request_state_resync
            - if:
                condition:
                  lambda: |-
                    return wifi::global_wifi_component->is_connected() &&
                           !id(ha_api_ready) &&
                           !id(ha_network_cycle_active) &&
                           id(startup_wait_seconds) >= 15 &&
                           id(startup_recovery_attempts) < 2 &&
                           (id(last_ha_recovery_ms) == 0 ||
                            millis() - id(last_ha_recovery_ms) >= 15000U);
                then:
                  - lambda: |-
                      id(startup_recovery_attempts)++;
                      id(startup_wait_seconds) = 0;
                  - script.execute: recover_ha_connection
      # Recover if a Home Assistant restart or a 2026.10 outgoing connection
      # handoff does not emit the client callback in the expected order.
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - lambda: |-
                id(ha_disconnected_seconds) = 0;
                if (!id(ha_disconnect_recovery_pending)) id(ha_recovery_active) = false;
            - if:
                condition:
                  lambda: 'return !id(ha_api_ready);'
                then:
                  - lambda: 'id(ha_api_ready) = true;'
                  - script.execute: refresh_nav
                  - script.execute: refresh_status_indicators
                  - script.execute: request_state_resync
          else:
            - if:
                condition:
                  lambda: 'return id(ha_api_ready);'
                then:
                  - lambda: 'id(ha_api_ready) = false;'
                  - script.execute: refresh_nav
                  - script.execute: refresh_status_indicators
            - lambda: |-
                if (id(user_wifi_enabled).state && wifi::global_wifi_component->is_connected()) {
                  id(ha_disconnected_seconds) = std::min<uint16_t>(300, id(ha_disconnected_seconds) + 1);
                } else {
                  id(ha_disconnected_seconds) = 0;
                  if (!id(user_wifi_enabled).state) {
                    id(ha_recovery_active) = false;
                    id(ha_disconnect_recovery_pending) = false;
                  }
                }
            - if:
                condition:
                  lambda: |-
                    const uint32_t now = millis();
                    return id(ha_disconnected_seconds) >= 15 &&
                           (id(last_ha_recovery_ms) == 0 ||
                            now - id(last_ha_recovery_ms) >= 60000U);
                then:
                  - script.execute: recover_ha_connection
      - lambda: |-
          // USB enumeration remains an independent positive signal. GPIO8's
          // divided VBUS reading now supplies the definitive dumb-charger path.
          const bool usb_host = usb_serial_jtag_is_connected();
          if (usb_host) {
            id(usb_host_seen) = true;
            id(usb_disconnect_score) = 0;
            if (!id(external_power)) id(power_transition_pending) = true;
            id(external_power) = true;
            id(battery_unplug_score) = 0;
            // Host enumeration proves external power, not battery current.
            // The battery-voltage trend determines Charging vs Battery idle.
          } else if (id(usb_host_seen)) {
            id(usb_disconnect_score)++;
            if (id(usb_disconnect_score) >= 2) {
              id(usb_host_seen) = false;
              id(usb_disconnect_score) = 0;
              if (!id(vbus_power_detected)) {
                id(external_power) = false;
                id(battery_trend_charging) = false;
                id(battery_charge_activity_score) = 0;
                id(battery_charge_complete) = false;
                id(battery_charge_complete_score) = 0;
                id(battery_charge_score) = 0;
                id(battery_charge_state) = 0;
                id(power_transition_pending) = true;
              }
            }
          }
          id(usb_power_detected) = usb_host;
      - if:
          condition:
            lambda: 'return id(power_transition_pending);'
          then:
            - lambda: 'id(power_transition_pending) = false;'
            - script.execute: refresh_battery_ui
      - if:
          condition:
            lambda: 'return id(stay_on_external_power).state && id(external_power) && id(screen_sleeping) && !id(manual_power_off);'
          then:
            - script.execute: wake_screen
  - interval: 500ms
    then:
      - lambda: |-
          // The panel and LVGL are paused while asleep. Do no invisible
          // animation, label, or geometry work; wake_screen redraws once.
          if (id(screen_sleeping)) return;
          if (id(network_activity_until_ms) == 0 ||
              (int32_t)(millis() - id(network_activity_until_ms)) >= 0) {
            lv_obj_add_flag(id(top_network_activity), LV_OBJ_FLAG_HIDDEN);
          }

          if (id(media_command_feedback_mode) != 0 &&
              millis() - id(media_command_feedback_started_ms) >= 5000U) {
            id(media_command_feedback_mode) = 0;
            lv_label_set_text(id(media_artist_label), id(media_artist).state.empty() ? "Last played item" : id(media_artist).state.c_str());
            lv_label_set_text(id(media_album_label), id(media_album).state.c_str());
            lv_obj_set_style_text_color(id(media_artist_label), lv_color_hex(0xF4F6F8), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(media_album_label), lv_color_hex(0x9CA6B5), LV_PART_MAIN);
          }

          lv_obj_t *bars[] = {
            id(music_wave_bar_1), id(music_wave_bar_2), id(music_wave_bar_3),
            id(music_wave_bar_4), id(music_wave_bar_5)
          };
          static const uint8_t patterns[8][5] = {
            {8,18,28,14,22}, {20,10,20,30,12}, {12,26,14,22,30}, {28,16,8,20,14},
            {16,30,20,10,24}, {24,14,30,18,8}, {10,22,16,28,20}, {18,8,24,12,28}
          };
          const bool dance = id(media_is_playing) && !id(media_is_video) &&
                             !id(screen_sleeping) && !id(ui_scrolling);
          if (dance) id(music_wave_phase) = (id(music_wave_phase) + 1) % 8;
          for (int i = 0; i < 5; i++) {
            const int h = dance ? patterns[id(music_wave_phase)][i] : 4;
            lv_obj_set_height(bars[i], h);
            lv_obj_set_y(bars[i], (36 - h) / 2);
            lv_obj_set_style_bg_color(bars[i],
                lv_color_hex(dance ? 0xEF4038 : 0x66707E), LV_PART_MAIN);
          }
      - if:
          condition:
            lambda: |-
              return id(command_pending) && !id(screen_sleeping) &&
                     !lv_obj_is_scrolling(id(music_root)) &&
                     !lv_obj_is_scrolling(id(video_scroll_root)) &&
                     !lv_obj_is_scrolling(id(video_description_card)) &&
                     !lv_obj_is_scrolling(id(settings_scroller));
          then:
            - lambda: 'id(pulse_phase) = !id(pulse_phase);'
            - lvgl.widget.update:
                id: play_button
                bg_color: !lambda 'return lv_color_hex(id(pulse_phase) ? 0x6E2325 : 0x2A2024);'
            - lvgl.widget.update:
                id: tools_play_button
                bg_color: !lambda 'return lv_color_hex(id(pulse_phase) ? 0x6E2325 : 0x2A2024);'
      - if:
          condition:
            lambda: |-
              if ((id(external_power) && id(stay_on_external_power).state) ||
                  (id(media_is_playing) && id(stay_on_media_playing).state) ||
                  id(screen_sleeping) || id(screen_timeout).state <= 0) return false;
              const uint32_t now = millis();
              const uint32_t timeout_ms = (uint32_t) id(screen_timeout).state * 1000U;
              return now - id(last_activity_ms) >= timeout_ms;
          then:
            - script.execute: sleep_screen
script:
  # This is the only normal-runtime writer for the elapsed/duration label.
  # Keeping formatting and interpolation together prevents HA attribute updates
  # and the local clock from alternating between incompatible time strings.
  - id: render_media_time
    mode: restart
    then:
      - lambda: |-
          if (!id(startup_state_ready) || id(screen_sleeping) || id(ui_scrolling)) return;
          const int duration = std::max(0, id(duration_seconds));
          int shown = std::max(0, id(position_seconds));
          if (id(media_is_playing) && id(position_anchor_ms) != 0) {
            shown += (int) ((millis() - id(position_anchor_ms)) / 1000U);
          }
          if (duration > 0) shown = std::min(shown, duration);

          char position[16];
          char total[16];
          const bool show_hours = duration >= 3600 || shown >= 3600;
          if (show_hours) {
            snprintf(position, sizeof(position), "%d:%02d:%02d", shown / 3600,
                     (shown / 60) % 60, shown % 60);
            snprintf(total, sizeof(total), "%d:%02d:%02d", duration / 3600,
                     (duration / 60) % 60, duration % 60);
            lv_obj_set_width(id(time_label), 130);
            lv_obj_set_x(id(header_progress), 236);
            lv_obj_set_width(id(header_progress), 100);
          } else {
            snprintf(position, sizeof(position), "%d:%02d", shown / 60, shown % 60);
            snprintf(total, sizeof(total), "%d:%02d", duration / 60, duration % 60);
            lv_obj_set_width(id(time_label), 88);
            lv_obj_set_x(id(header_progress), 194);
            lv_obj_set_width(id(header_progress), 142);
          }

          id(position_text) = position;
          id(duration_text) = total;
          char value[40];
          if (duration > 0) snprintf(value, sizeof(value), "%s / %s", position, total);
          else snprintf(value, sizeof(value), "%s", position);
          lv_label_set_text(id(time_label), value);
          if (duration > 0) {
            lv_bar_set_value(id(header_progress),
                             std::min(1000, shown * 1000 / duration), LV_ANIM_OFF);
          }

  - id: request_queue_play
    parameters:
      index: int
    then:
      - lambda: |-
          id(pending_queue_index) = index;
          id(pending_queue_video_id).clear();
          if (!id(ha_api_ready)) {
            id(pending_queue_video_id).clear();
            lv_label_set_text(id(queue_confirm_heading), "Controller offline");
            lv_label_set_text(id(queue_confirm_message), "Not connected to Home Assistant. Reconnect and try again.");
            lv_label_set_text(id(queue_confirm_title), "");
            lv_obj_add_flag(id(queue_confirm_switch_button), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(queue_confirm_modal), LV_OBJ_FLAG_HIDDEN);
            return;
          }
          lv_label_set_text(id(queue_confirm_heading), "Switch video?");
          lv_label_set_text(id(queue_confirm_message), "A video is playing. Tap Switch video to continue.");
          lv_obj_clear_flag(id(queue_confirm_switch_button), LV_OBJ_FLAG_HIDDEN);
          std::string payload = id(youtube_queue_json).state;
          if (payload.rfind("json:", 0) == 0) payload.erase(0, 5);
          json::parse_json(payload, [index](JsonObject root) -> bool {
            JsonArray items = root["items"].as<JsonArray>();
            if (index < 0 || index >= (int) items.size()) return false;
            id(pending_queue_video_id) = items[index]["video_id"] | "";
            lv_label_set_text(id(queue_confirm_title), items[index]["title"] | "YouTube video");
            return true;
          });
      - if:
          condition:
            lambda: 'return id(pending_queue_video_id).size() == 11;'
          then:
            - if:
                condition:
                  lambda: 'return id(queue_youtube_active).state || id(queue_vlc_active).state;'
                then:
                  - lvgl.widget.show: queue_confirm_modal
                  - script.execute: queue_confirm_timeout
                else:
                  - script.execute: confirm_queue_play
  - id: request_queue_dismiss
    parameters:
      index: int
    then:
      - lambda: |-
          id(dismiss_queue_video_id).clear();
          id(dismiss_queue_source).clear();
          if (!id(ha_api_ready)) return;
          std::string payload=id(youtube_queue_json).state;
          if (payload.rfind("json:",0)==0) payload.erase(0,5);
          json::parse_json(payload,[index](JsonObject root) -> bool {
            JsonArray items=root["items"].as<JsonArray>();
            if(index<0 || index>=(int)items.size()) return false;
            id(dismiss_queue_video_id)=items[index]["video_id"] | "";
            id(dismiss_queue_source)=root["source_device"] | "";
            return true;
          });
      - if:
          condition:
            lambda: 'return id(ha_api_ready) && id(dismiss_queue_video_id).size()==11 && !id(dismiss_queue_source).empty();'
          then:
            - homeassistant.action:
                action: script.dismiss_youtube_item
                data:
                  video_id: !lambda 'return id(dismiss_queue_video_id);'
                  source_device: !lambda 'return id(dismiss_queue_source);'
  - id: confirm_queue_play
    then:
      - script.stop: queue_confirm_timeout
      - lvgl.widget.hide: queue_confirm_modal
      - lambda: |-
          if (!id(ha_api_ready)) {
            id(pending_queue_video_id).clear();
            lv_label_set_text(id(queue_confirm_heading), "Controller offline");
            lv_label_set_text(id(queue_confirm_message), "Not connected to Home Assistant. Reconnect and try again.");
            lv_label_set_text(id(queue_confirm_title), "");
            lv_obj_add_flag(id(queue_confirm_switch_button), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(queue_confirm_modal), LV_OBJ_FLAG_HIDDEN);
            return;
          }
      - if:
          condition:
            lambda: 'return id(pending_queue_video_id).size() == 11 && id(ha_api_ready);'
          then:
            - homeassistant.action:
                action: script.play_youtube_queue_item
                data:
                  index: !lambda 'return id(pending_queue_index);'
                  selected_video_id: !lambda 'return id(pending_queue_video_id);'
                  confirmed: 'true'
      - lambda: 'id(pending_queue_video_id).clear();'
  - id: queue_confirm_timeout
    mode: restart
    then:
      - delay: 30s
      - lvgl.widget.hide: queue_confirm_modal
      - lambda: 'id(pending_queue_video_id).clear();'
  - id: refresh_meeting_card
    mode: restart
    then:
      - lvgl.label.update:
          id: meeting_title_label
          text: !lambda |-
            const std::string title = id(current_meeting_title).state;
            if (title.empty() || title == "unknown" || title == "unavailable")
              return std::string("Work meeting in progress");
            return title;
      - lvgl.label.update:
          id: meeting_time_label
          text: !lambda |-
            auto format_time = [](const std::string &value) -> std::string {
              if (value.size() < 16) return std::string("");
              int hour = atoi(value.substr(11, 2).c_str());
              const std::string minute = value.substr(14, 2);
              const bool pm = hour >= 12;
              int shown = hour % 12; if (shown == 0) shown = 12;
              return std::to_string(shown) + ":" + minute + (pm ? " PM" : " AM");
            };
            const std::string start = format_time(id(current_meeting_start).state);
            const std::string end = format_time(id(current_meeting_end).state);
            if (start.empty() || end.empty()) return std::string("");
            return start + " - " + end;
      - script.execute: render_meeting_mute_state

  - id: render_meeting_mute_state
    mode: restart
    then:
      - lvgl.label.update:
          id: meeting_mic_icon
          text: !lambda |-
            return id(meeting_mute_state) == 1 ? std::string("\U0000E02B") : std::string("\U0000E029");
      - lvgl.label.update:
          id: meeting_mute_label
          text: !lambda |-
            if (id(meeting_mute_state) == 1) return std::string("Unmute mic");
            if (id(meeting_mute_state) == 0) return std::string("Mute mic");
            return std::string("Toggle mic");
      - lvgl.label.update:
          id: meeting_mic_state_label
          text: !lambda |-
            if (id(meeting_mute_state) == 1) return std::string("Microphone muted");
            if (id(meeting_mute_state) == 0) return std::string("Microphone live");
            return std::string("Tap to toggle the Work Mac microphone");
      - lvgl.widget.update:
          id: meeting_mute_button
          bg_color: !lambda |-
            return id(meeting_mute_state) == 1 ? lv_color_hex(0x6E2325) : lv_color_hex(0x19344A);
          border_color: !lambda |-
            return id(meeting_mute_state) == 1 ? lv_color_hex(0xEF4038) : lv_color_hex(0x62B7FF);

  - id: request_meeting_mute_state
    mode: restart
    then:
      - http_request.get:
          url: http://${work_mac_btt_host}:51520/trigger_named/?trigger_name=media_controller_refresh_teams_mute_state

  - id: read_meeting_mute_state
    mode: restart
    then:
      - http_request.get:
          url: http://${work_mac_btt_host}:51520/get_string_variable/?variableName=teams_mute_state
          capture_response: true
          max_response_buffer_size: 64
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) return;
                  while (!body.empty() && isspace((unsigned char) body.front())) body.erase(body.begin());
                  while (!body.empty() && isspace((unsigned char) body.back())) body.pop_back();
                  if (body == "muted") id(meeting_mute_state) = 1;
                  else if (body == "unmuted") id(meeting_mute_state) = 0;
                  else return;
              - script.execute: render_meeting_mute_state

  - id: refresh_meeting_mute_state
    mode: restart
    then:
      - script.execute: request_meeting_mute_state
      - delay: 650ms
      - script.execute: read_meeting_mute_state

  - id: toggle_meeting_mute
    mode: restart
    then:
      - homeassistant.action:
          action: rest_command.work_macbook_toggle_microphone
      - lambda: |-
          if (id(meeting_mute_state) == 0) id(meeting_mute_state) = 1;
          else if (id(meeting_mute_state) == 1) id(meeting_mute_state) = 0;
      - script.execute: render_meeting_mute_state
      - delay: 700ms
      - script.execute: refresh_meeting_mute_state

  - id: layout_media_title
    mode: restart
    then:
      - lambda: |-
          lv_obj_t *title = id(media_title_label);
          lv_anim_del(title, nullptr);
          const bool has_title = !id(media_title).state.empty() &&
                                 id(media_title).state != "unknown" &&
                                 id(media_title).state != "unavailable";
          const std::string source = has_title ? id(media_title).state : "Nothing Playing";
          lv_label_set_text(title, source.c_str());
          lv_label_set_long_mode(title, LV_LABEL_LONG_MODE_WRAP);
          // The round screen's chord is narrower at this height. Wrap within
          // the fully visible area so the curved mask creates another row
          // instead of clipping the last words.
          lv_obj_set_width(title, 210);
          lv_obj_set_height(title, LV_SIZE_CONTENT);
          lv_obj_set_y(title, 0);
          lv_obj_update_layout(title);
          const int viewport_h = 21;
          const int content_h = lv_obj_get_height(title);
          const lv_font_t *font = lv_obj_get_style_text_font(title, LV_PART_MAIN);
          id(title_scroll_line_px) = std::max(1, (int) lv_font_get_line_height(font) +
                                                (int) lv_obj_get_style_text_line_space(title, LV_PART_MAIN));
          const int line_space = (int) lv_obj_get_style_text_line_space(title, LV_PART_MAIN);
          const int lines = std::max(1, (content_h + line_space + id(title_scroll_line_px) - 1) /
                                         id(title_scroll_line_px));
          if (content_h > viewport_h && !id(ui_scrolling)) {
            // Repeat the wrapped title below itself. Reaching the repeated first
            // line makes the loop back to y=0 visually seamless.
            const std::string loop_text = source + "\n" + source;
            lv_label_set_text(title, loop_text.c_str());
            lv_obj_update_layout(title);
            id(title_scroll_overflow_px) = lines * id(title_scroll_line_px);
            lv_anim_t a;
            lv_anim_init(&a);
            lv_anim_set_var(&a, title);
            lv_anim_set_exec_cb(&a, [](void *obj, int32_t phase) {
              constexpr int segment_ms = 1900;
              constexpr int hold_ms = 1450;
              const int line = phase / segment_ms;
              const int within = phase % segment_ms;
              const int base = std::min(line * id(title_scroll_line_px), id(title_scroll_overflow_px));
              int offset = base;
              if (base < id(title_scroll_overflow_px) && within > hold_ms) {
                const int distance = std::min(id(title_scroll_line_px),
                                              id(title_scroll_overflow_px) - base);
                const int elapsed = within - hold_ms;
                const int move_ms = segment_ms - hold_ms;
                // Smoothstep gives a quick, readable glide rather than a jump.
                const float t = std::min(1.0f, (float) elapsed / (float) move_ms);
                const float eased = t * t * (3.0f - 2.0f * t);
                offset += (int) lroundf(distance * eased);
              }
              lv_obj_set_y((lv_obj_t *) obj, -offset);
            });
            lv_anim_set_values(&a, 0, lines * 1900);
            lv_anim_set_time(&a, lines * 1900);
            lv_anim_set_delay(&a, 1200);
            lv_anim_set_repeat_delay(&a, 1500);
            lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
            lv_anim_start(&a);
          } else {
            id(title_scroll_overflow_px) = 0;
          }
          lv_obj_set_y(id(media_artist_label), 21);
          lv_obj_set_y(id(media_album_label), 40);
          lv_obj_clear_flag(id(media_artist_label), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(media_album_label), LV_OBJ_FLAG_HIDDEN);

  - id: set_cpu_interactive
    mode: restart
    then:
      - lambda: |-
          if (id(cpu_profile_mhz) == 240) return;
          esp_pm_config_t power_profile{};
          power_profile.max_freq_mhz = 240;
          power_profile.min_freq_mhz = 240;
          power_profile.light_sleep_enable = false;
          if (esp_pm_configure(&power_profile) == ESP_OK)
            id(cpu_profile_mhz) = 240;

  - id: set_cpu_idle
    mode: restart
    then:
      - lambda: |-
          const bool network_needs_headroom = id(user_wifi_enabled).state &&
              (!wifi::global_wifi_component->is_connected() ||
               !api::global_api_server->is_connected_with_state_subscription());
          const int target_mhz = (id(external_power) || network_needs_headroom) ? 240 : 80;
          if (id(cpu_profile_mhz) == target_mhz) return;
          esp_pm_config_t power_profile{};
          power_profile.max_freq_mhz = target_mhz;
          power_profile.min_freq_mhz = target_mhz;
          power_profile.light_sleep_enable = false;
          if (esp_pm_configure(&power_profile) == ESP_OK) {
            id(cpu_profile_mhz) = target_mhz;
            if (!id(screen_sleeping) && id(current_page) == 3)
              id(refresh_system_ui).execute();
          }

  - id: haptic_tick
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(haptic_profile) > 0;'
          then:
            - drv2605.play_effect:
                id: haptic_driver
                effect: !lambda |-
                  if (id(haptic_profile) == 1) return 6;
                  if (id(haptic_profile) == 2) return 4;
                  return 1;

  - id: haptic_preview
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(haptic_profile) > 0;'
          then:
            - drv2605.play_effect:
                id: haptic_driver
                effect: !lambda |-
                  if (id(haptic_profile) == 1) return 7;
                  if (id(haptic_profile) == 2) return 1;
                  return 12;

  - id: show_firmware_update_preflight
    mode: restart
    then:
      - lambda: |-
          esp_pm_config_t power_profile{};
          power_profile.max_freq_mhz = 240;
          power_profile.min_freq_mhz = 240;
          power_profile.light_sleep_enable = false;
          esp_pm_configure(&power_profile);
          id(cpu_profile_mhz) = 240;
      - script.stop: sleep_screen
      - lvgl.resume:
      - light.turn_on:
          id: amoled_brightness
          brightness: !lambda 'return std::max(0.65f, id(display_brightness).state / 100.0f);'
          transition_length: 0ms
      - lambda: |-
          id(manual_power_off) = false;
          id(screen_sleeping) = false;
          id(current_sleep_stage) = 0;
          id(last_activity_ms) = millis();
          id(ota_preflight_phase) = 0;
          id(ota_preflight_started_ms) = millis();
          id(ota_preflight_active) = true;
          lv_label_set_text(id(ota_status_label), "Firmware update inbound");
          lv_label_set_text(id(ota_progress_label), "Preparing controller");
          lv_bar_set_value(id(ota_progress_bar), 10, LV_ANIM_OFF);
          lv_obj_clear_flag(id(ota_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(ota_overlay));

  - id: refresh_playback_status_icon
    mode: restart
    then:
      - lambda: |-
          if (id(current_page) == 3) {
            lv_label_set_text(id(media_kind_label), "SETTINGS");
            lv_obj_add_flag(id(top_playback_icon), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_x(id(media_kind_label), 0);
            lv_obj_set_width(id(media_kind_label), 58);
            return;
          }
          lv_label_set_text(id(media_kind_label), id(media_mode)==2 ? "VIDEO" : (id(media_mode)==1 ? "MUSIC" : "IDLE"));
          const bool playing = id(media_is_playing);
          const bool recently_paused = !playing && id(recent_pause_until_ms) != 0 &&
                                       (int32_t)(id(recent_pause_until_ms) - millis()) > 0;
          const char *title = lv_label_get_text(id(media_kind_label));
          lv_point_t title_size;
          const lv_font_t *title_font = lv_obj_get_style_text_font(id(media_kind_label), LV_PART_MAIN);
          lv_text_get_size(&title_size, title, title_font, 0, 0, LV_COORD_MAX, LV_TEXT_FLAG_NONE);
          lv_obj_set_x(id(top_playback_icon), 42);
          if (playing) {
            lv_label_set_text(id(top_playback_icon), "\U000F040A");
            lv_obj_set_style_bg_opa(id(top_playback_icon), LV_OPA_TRANSP, LV_PART_MAIN);
            lv_obj_set_style_text_color(id(top_playback_icon), lv_color_hex(0x54D19A), LV_PART_MAIN);
            lv_obj_clear_flag(id(top_playback_icon), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_x(id(media_kind_label), 0);
            lv_obj_set_width(id(media_kind_label), 40);
          } else if (recently_paused) {
            lv_label_set_text(id(top_playback_icon), "\U000F03E4");
            lv_obj_set_style_bg_opa(id(top_playback_icon), LV_OPA_TRANSP, LV_PART_MAIN);
            lv_obj_set_style_text_color(id(top_playback_icon), lv_color_hex(0xFFD60A), LV_PART_MAIN);
            lv_obj_clear_flag(id(top_playback_icon), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_x(id(media_kind_label), 0);
            lv_obj_set_width(id(media_kind_label), 40);
          } else {
            id(recent_pause_until_ms) = 0;
            lv_obj_add_flag(id(top_playback_icon), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_x(id(media_kind_label), 0);
            lv_obj_set_width(id(media_kind_label), 40);
          }

  - id: refresh_music_synopsis
    mode: restart
    then:
      - lambda: |-
          // Home Assistant owns the shared display text so the controller and
          // dashboards always use the same synopsis and fallback rules.
          const std::string synopsis = id(media_summary).state;
          lv_label_set_text(id(music_summary_label),
                            synopsis.empty() || synopsis == "unknown" || synopsis == "unavailable"
                              ? "No synopsis is available for this track."
                              : synopsis.c_str());

  - id: flush_deferred_ui
    mode: restart
    then:
      # SCROLL_END can fire for a nested description pane while its parent is
      # still coasting. Wait one frame and flush only after every pane settles.
      - delay: 20ms
      - if:
          condition:
            lambda: |-
              return !lv_obj_is_scrolling(id(music_root)) &&
                     !lv_obj_is_scrolling(id(music_summary_card)) &&
                     !lv_obj_is_scrolling(id(video_scroll_root)) &&
                     !lv_obj_is_scrolling(id(video_description_card)) &&
                     !lv_obj_is_scrolling(id(settings_scroller));
          then:
            - lambda: |-
                id(ui_scrolling) = false;
                lv_bar_set_value(id(header_progress), id(progress_percent) * 10, LV_ANIM_OFF);
                id(layout_media_title).execute();
            - script.execute: render_media_time
            - if:
                condition:
                  lambda: 'return id(progress_completion_dirty);'
                then:
                  - lambda: 'id(progress_completion_dirty) = false;'
                  - script.execute: refresh_resume_state
            - if:
                condition:
                  lambda: 'return id(status_indicators_dirty);'
                then:
                  - script.execute: refresh_status_indicators
            - if:
                condition:
                  lambda: 'return id(artwork_refresh_dirty);'
                then:
                  - lambda: 'id(artwork_refresh_dirty) = false;'
                  - online_image.set_url:
                      id: media_artwork
                      url: !lambda |-
                        const std::string paired = id(controller_artwork_url).state;
                        if (!paired.empty() && paired != "unknown" && paired != "unavailable")
                          return std::string("http://homeassistant.local:8123") + paired;
                        return std::string("http://homeassistant.local:8123/local/nowplaying/controller-artwork.jpg");
                      update: true
            - if:
                condition:
                  lambda: 'return id(current_page) == 3;'
                then:
                  - script.execute: refresh_system_ui

  - id: recover_ha_after_disconnect
    mode: restart
    then:
      # The 2026.10 dial-back state stream can reconnect before Home
      # Assistant's normal client has re-subscribed to device-originated
      # actions. Complete one network cycle after a confirmed HA disconnect;
      # this is the same recovery the manual Wi-Fi toggle proved reliable.
      - delay: 1500ms
      - if:
          condition:
            lambda: |-
              return id(ha_disconnect_recovery_pending) &&
                     id(user_wifi_enabled).state;
          then:
            - script.execute: recover_ha_connection

  - id: recover_ha_connection
    mode: restart
    then:
      # Wi-Fi association and DHCP remain untouched. When the gateway path is
      # healthy, the ESPHome API owns reconnection and we only refresh state.
      - script.execute: set_cpu_interactive
      - lambda: |-
          id(last_ha_recovery_ms) = millis();
          id(ha_disconnected_seconds) = 0;
          id(ha_api_ready) = false;
          id(ha_recovery_active) = true;
          id(ha_disconnect_recovery_pending) = false;
          id(ha_network_cycle_active) = true;
      - script.execute: refresh_nav
      - script.execute: refresh_status_indicators
      # Keep the radio up. A delayed Home Assistant subscription is an API
      # concern and must not strand the visible controller UI.
      - wifi.enable:
      - delay: 2s
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - script.execute: request_state_resync
      - lambda: 'id(ha_network_cycle_active) = false;'

  - id: reconnect_ha_now
    mode: restart
    then:
      # Preserve an established Wi-Fi/DHCP link. An authenticated API client
      # only needs a fresh state request; tearing down the active client from
      # inside a UI callback can leave the controller in a failed loop.
      - script.execute: set_cpu_interactive
      - lambda: |-
          id(last_activity_ms) = millis();
          id(cpu_boost_hold_until) = millis() + 15000U;
          id(ha_disconnected_seconds) = 0;
          if (!wifi::global_wifi_component->is_connected()) {
            id(ha_api_ready) = false;
            id(ha_recovery_active) = true;
            wifi::global_wifi_component->retry_connect();
          } else if (api::global_api_server->is_connected_with_state_subscription()) {
            id(ha_api_ready) = true;
            id(ha_recovery_active) = false;
          } else {
            id(ha_api_ready) = false;
            id(ha_recovery_active) = true;
          }
      - wifi.enable:
      - script.execute: refresh_nav
      - script.execute: refresh_status_indicators
      - delay: 150ms
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - script.execute: request_state_resync

  - id: request_state_resync
    mode: restart
    then:
      # The client callback fires after the authenticated API handshake.
      - delay: 150ms
      - if:
          condition:
            and:
              - api.connected:
                  state_subscription_only: true
              - lambda: |-
                  const uint32_t now = millis();
                  const uint32_t minimum_gap = id(startup_state_ready) ? 5000U : 2000U;
                  return id(last_state_resync_ms) == 0 ||
                         now - id(last_state_resync_ms) >= minimum_gap;
          then:
            - lambda: |-
                id(last_state_resync_ms) = millis();
                if (!id(startup_state_ready)) {
                  id(fresh_artwork_ready) = false;
                  lv_obj_add_flag(id(artwork_widget), LV_OBJ_FLAG_HIDDEN);
                  lv_obj_clear_flag(id(artwork_placeholder), LV_OBJ_FLAG_HIDDEN);
                }
            - logger.log:
                level: INFO
                format: "HA state channel ready; requesting fresh Now Playing state"
            - homeassistant.action:
                action: script.nowplaying_request_refresh
            # The script updates HA first; repaint after the resulting entity
            # callbacks have had time to arrive, then bypass the artwork cache.
            - delay: 900ms
            - script.execute: render_play_state
            - online_image.set_url:
                id: media_artwork
                url: !lambda |-
                  const std::string paired = id(controller_artwork_url).state;
                  if (!paired.empty() && paired != "unknown" && paired != "unavailable")
                    return std::string("http://homeassistant.local:8123") + paired;
                  return std::string("http://homeassistant.local:8123/local/nowplaying/controller-artwork.jpg");
                update: true

  - id: animate_artwork_placeholder
    mode: restart
    then:
      - lambda: |-
          // Animate only the small artwork tile while the fresh JPEG arrives.
          // This provides visible progress without redrawing a full page.
          lv_obj_t *blobs[] = {id(artwork_blob_a), id(artwork_blob_b), id(artwork_blob_c)};
          for (auto *blob : blobs) lv_anim_delete(blob, nullptr);

          // Curated combinations keep the variation lively without producing
          // muddy or clashing random colors.
          static const uint32_t palettes[][3] = {
            {0xEF4038, 0xF29A54, 0x7A68D8},
            {0xFF4D6D, 0xFF9F1C, 0x5F6FFF},
            {0x35C6A8, 0x4D8DFF, 0x9B6BFF},
            {0xFF5C8A, 0xA763FF, 0x4AA8FF},
            {0xF05D5E, 0xF2C14E, 0x5BC0BE}
          };
          const uint32_t palette = esp_random() % 5;
          lv_obj_set_style_bg_color(id(artwork_blob_a), lv_color_hex(palettes[palette][0]), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(artwork_blob_b), lv_color_hex(palettes[palette][1]), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(artwork_blob_c), lv_color_hex(palettes[palette][2]), LV_PART_MAIN);

          auto drift = [](lv_obj_t *blob, bool horizontal, int32_t from, int32_t to,
                          uint32_t duration, uint32_t delay) {
            lv_anim_t a;
            lv_anim_init(&a);
            lv_anim_set_var(&a, blob);
            lv_anim_set_values(&a, from, to);
            lv_anim_set_duration(&a, duration);
            lv_anim_set_delay(&a, delay);
            lv_anim_set_playback_duration(&a, duration);
            lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
            lv_anim_set_path_cb(&a, lv_anim_path_ease_in_out);
            if (horizontal)
              lv_anim_set_exec_cb(&a, [](void *obj, int32_t value) {
                lv_obj_set_x((lv_obj_t *) obj, value);
              });
            else
              lv_anim_set_exec_cb(&a, [](void *obj, int32_t value) {
                lv_obj_set_y((lv_obj_t *) obj, value);
              });
            lv_anim_start(&a);
          };
          drift(id(artwork_blob_a), true,   3, 44, 1350,   0);
          drift(id(artwork_blob_a), false, 10, 48, 1750, 120);
          drift(id(artwork_blob_b), true,  54, 16, 1650, 180);
          drift(id(artwork_blob_b), false,  4, 50, 1420,   0);
          drift(id(artwork_blob_c), true,  24, 49, 1900,  80);
          drift(id(artwork_blob_c), false, 56, 15, 1580, 240);

  - id: stop_artwork_placeholder
    mode: restart
    then:
      - lambda: |-
          lv_anim_delete(id(artwork_blob_a), nullptr);
          lv_anim_delete(id(artwork_blob_b), nullptr);
          lv_anim_delete(id(artwork_blob_c), nullptr);

  - id: refresh_startup_ui
    mode: restart
    then:
      - lambda: |-
          const bool connected_fallback = id(ha_api_ready) && id(startup_wait_seconds) >= 3;
          if (id(startup_state_ready) || connected_fallback) {
            // Never trap the controller on its splash screen when the API is
            // authenticated but the initial media-state callback is late. The
            // normal subscriptions and resync retries keep running behind the
            // usable interface and replace this status as soon as state lands.
            if (!id(startup_state_ready)) {
              lv_label_set_text(id(media_kind_label), "REFRESHING…");
              lv_obj_set_style_text_color(id(media_kind_label), lv_color_hex(0xFFD60A), LV_PART_MAIN);
            }
            lv_obj_add_flag(id(startup_overlay), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(page_dock), LV_OBJ_FLAG_HIDDEN);
            if (id(startup_settings_open) || id(current_page) >= 2)
              lv_obj_add_flag(id(metadata_card), LV_OBJ_FLAG_HIDDEN);
            else
              lv_obj_clear_flag(id(metadata_card), LV_OBJ_FLAG_HIDDEN);
            return;
          }

          const bool wifi_ready = wifi::global_wifi_component->is_connected();
          const bool ha_ready = id(ha_api_ready);
          lv_label_set_text(id(startup_wifi_label),
                            wifi_ready ? "Wi-Fi connected" : "Connecting to Wi-Fi...");
          lv_obj_set_style_text_color(id(startup_wifi_label),
                                      lv_color_hex(wifi_ready ? 0x54D19A : 0x9CA6B5), LV_PART_MAIN);
          lv_label_set_text(id(startup_ha_label),
                            ha_ready ? "Home Assistant connected" : "Connecting to Home Assistant...");
          lv_obj_set_style_text_color(id(startup_ha_label),
                                      lv_color_hex(ha_ready ? 0x54D19A : 0x9CA6B5), LV_PART_MAIN);
          char media_status[48];
          if (!ha_ready) {
            snprintf(media_status, sizeof(media_status), "Refresh data");
          } else {
            const int retry = id(startup_wait_seconds) < 2 ? 1 :
                              id(startup_wait_seconds) < 4 ? 2 :
                              id(startup_wait_seconds) < 6 ? 3 : 4;
            snprintf(media_status, sizeof(media_status), "Refreshing data... try %d of 4", retry);
          }
          lv_label_set_text(id(startup_nowplaying_label), media_status);
          lv_obj_set_style_text_color(id(startup_nowplaying_label),
                                      lv_color_hex(ha_ready ? 0xFFD60A : 0x66707E), LV_PART_MAIN);

          lv_obj_add_flag(id(metadata_card), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(page_dock), LV_OBJ_FLAG_HIDDEN);
          id(fresh_artwork_ready) = false;
          lv_obj_add_flag(id(artwork_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(artwork_placeholder), LV_OBJ_FLAG_HIDDEN);
          id(animate_artwork_placeholder).execute();
          if (id(startup_settings_open))
            lv_obj_add_flag(id(startup_overlay), LV_OBJ_FLAG_HIDDEN);
          else
            lv_obj_clear_flag(id(startup_overlay), LV_OBJ_FLAG_HIDDEN);

  - id: finalize_startup_snapshot
    mode: restart
    then:
      # Let the remaining attributes from the same Home Assistant state frame
      # land before exposing the media card.
      - delay: 180ms
      - if:
          condition:
            lambda: 'return id(startup_state_ready) && !id(startup_snapshot_finalized);'
          then:
            - lambda: |-
                lv_label_set_text(id(startup_wifi_label), "Wi-Fi connected");
                lv_label_set_text(id(startup_ha_label), "Home Assistant connected");
                lv_label_set_text(id(startup_nowplaying_label), "Current data ready");
                lv_obj_set_style_text_color(id(startup_wifi_label), lv_color_hex(0x54D19A), LV_PART_MAIN);
                lv_obj_set_style_text_color(id(startup_ha_label), lv_color_hex(0x54D19A), LV_PART_MAIN);
                lv_obj_set_style_text_color(id(startup_nowplaying_label), lv_color_hex(0x54D19A), LV_PART_MAIN);
            # Keep a successful startup visible long enough to read without
            # making a genuinely slow connection wait any longer.
            - delay: !lambda |-
                const uint32_t elapsed = millis() - id(startup_started_ms);
                return elapsed < 2800U ? 2800U - elapsed : 0U;
            - lambda: |-
                id(startup_wait_seconds) = 0;
                id(startup_recovery_attempts) = 0;
                id(startup_snapshot_finalized) = true;
            - script.execute: refresh_startup_ui
            - if:
                condition:
                  lambda: 'return !id(startup_settings_open);'
                then:
                  - lambda: 'id(current_page) = 0;'
                  - if:
                      condition: { lambda: 'return id(media_is_video);' }
                      then:
                        - lvgl.page.show: { id: tools_page, animation: FADE_IN, time: 90ms }
                      else:
                        - lvgl.page.show: { id: now_page, animation: FADE_IN, time: 90ms }
            - script.execute: refresh_nav

  - id: apply_wake_brightness
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(brightness_wake_pending) &&
                     !id(brightness_user_overridden) &&
                     !isnan(id(office_ambient_lux).state) &&
                     id(controller_time).now().is_valid();
          then:
            - lambda: 'id(brightness_auto_setting) = true;'
            - number.set:
                id: display_brightness
                value: !lambda |-
                  auto now = id(controller_time).now();
                  if (now.hour >= 21 || now.hour < 7) return 5.0f;
                  // The round AMOLED is perceptually brighter. During the day,
                  // retain the established lux curve; nighttime cold boots use
                  // the panel minimum above.
                  const float lux = std::max(0.0f, std::min(200.0f,
                      id(office_ambient_lux).state));
                  const float level = logf(1.0f + lux) / logf(201.0f);
                  const float target = 35.0f + 25.0f * level;
                  return roundf(target / 5.0f) * 5.0f;
            - lambda: |-
                id(brightness_auto_setting) = false;
                id(brightness_wake_pending) = false;

  - id: wake_screen
    mode: restart
    then:
      - lambda: |-
          esp_pm_config_t power_profile{};
          // A wake includes screen rendering and may include Wi-Fi/API
          // recovery. Start interactively; the load governor returns to the
          // rotary controller's 80 MHz idle floor after the state is ready.
          power_profile.max_freq_mhz = 240;
          power_profile.min_freq_mhz = 240;
          power_profile.light_sleep_enable = false;
          esp_pm_configure(&power_profile);
          id(cpu_profile_mhz) = 240;
      - script.stop: sleep_screen
      - if:
          condition:
            lambda: 'return id(current_sleep_stage) >= 2 && id(user_wifi_enabled).state;'
          then:
            - wifi.enable:
      - lambda: |-
          id(manual_power_off) = false;
          id(screen_sleeping) = false;
          id(current_sleep_stage) = 0;
          id(last_activity_ms) = millis();
      - lvgl.resume:
      - light.turn_on:
          id: amoled_brightness
          brightness: !lambda 'return id(display_brightness).state / 100.0f;'
          transition_length: 100ms
      - script.execute: refresh_nav
      - script.execute: refresh_control_mode
      - script.execute: refresh_battery_ui
      - script.execute: refresh_status_indicators
      # Display-only sleep keeps the API connected, so it needs its own refresh.
      # Eco/deep wake reconnects Wi-Fi and is refreshed by on_client_connected.
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - script.execute: request_state_resync

  - id: sleep_screen
    mode: restart
    then:
      - lambda: |-
          id(screen_sleeping) = true;
          id(current_sleep_stage) = 1;
      - light.turn_off:
          id: amoled_brightness
          transition_length: 250ms
      - delay: 260ms
      - lvgl.pause:
      # LVGL and the panel are idle now. Eco/display-only sleep can run the
      # ESP32-S3 at 80 MHz. A real touch or knob turn raises it to 240 MHz.
      - lambda: |-
          const int target_mhz = id(external_power) ? 240 : 80;
          esp_pm_config_t power_profile{};
          power_profile.max_freq_mhz = target_mhz;
          power_profile.min_freq_mhz = target_mhz;
          power_profile.light_sleep_enable = false;
          esp_pm_configure(&power_profile);
          id(cpu_profile_mhz) = target_mhz;
      - if:
          condition:
            lambda: 'return id(sleep_depth) >= 1;'
          then:
            - delay: !lambda 'return (uint32_t) std::max(30.0f, id(device_sleep_delay).state) * 1000U;'
            # A screen may time out during a long playback session. Keep the API
            # available until playback and the recent-pause grace period are over.
            - while:
                condition:
                  lambda: |-
                    const bool recently_playing = id(last_media_activity_ms) != 0 &&
                                                  millis() - id(last_media_activity_ms) < 300000U;
                    return !id(external_power) && id(screen_sleeping) && id(sleep_depth) >= 1 &&
                           (id(media_is_playing) || recently_playing);
                then:
                  - delay: 5s
            - if:
                condition:
                  lambda: 'return !id(external_power) && id(screen_sleeping) && id(sleep_depth) >= 1;'
                then:
                  - lambda: 'id(current_sleep_stage) = 2;'
                  - if:
                      condition:
                        lambda: 'return id(sleep_depth) >= 2;'
                      then:
                        - deep_sleep.enter: controller_deep_sleep
                      else:
                        # Eco preserves connectivity at the low-power CPU setting.
                        # Full hardware/radio shutdown belongs to explicit Deep.
                        - if:
                            condition:
                              lambda: 'return id(user_wifi_enabled).state;'
                            then:
                              - wifi.enable:

  - id: manual_sleep
    mode: restart
    then:
      # A long press is a true hardware-off request. Drop the battery power-hold
      # rail; if USB keeps the MCU alive, deep sleep provides the same behavior.
      - script.stop: sleep_screen
      - lambda: |-
          id(manual_power_off) = true;
          id(screen_sleeping) = true;
          id(current_sleep_stage) = 2;
          id(motion_wake_blocked_until) = millis() + 10000U;
      - light.turn_off:
          id: amoled_brightness
          transition_length: 180ms
      - delay: 220ms
      - lvgl.pause:
      - lambda: |-
          gpio_hold_dis(GPIO_NUM_16);
          gpio_set_direction(GPIO_NUM_16, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_16, 0);
          gpio_hold_en(GPIO_NUM_16);
      # Normally battery power is gone above. USB power bypasses that rail, so
      # enter deep sleep and allow only the physical GPIO15 power key to wake it.
      - delay: 100ms
      - deep_sleep.enter: controller_deep_sleep

  - id: refresh_battery_ui
    mode: restart
    then:
      - lambda: |-
          const float volts = isnan(id(battery_voltage_ema))
                                  ? id(system_voltage).state : id(battery_voltage_ema);
          const int pct = id(battery_percent);
          char detail[128];
          const char *power_text = !id(external_power) ? "External: Disconnected" :
              (id(battery_charge_state) == 1 ? "External: Connected · Charging" :
               (id(battery_charge_state) == 2 ? "External: Connected · Full" :
                                                "External: Connected · Battery idle"));
          snprintf(detail, sizeof(detail), "Battery: %d%%  ·  Now: %.3f V\nSmoothed: %.3f V\n%s\nTrend: %+.1f mV/min",
                   pct, id(system_voltage).state, volts, power_text,
                   id(battery_voltage_trend_mv_min));
          lv_label_set_text(id(device_power_label), detail);
          char capacity[24]; snprintf(capacity, sizeof(capacity), "%.0f mAh", id(battery_capacity).state);
          lv_label_set_text(id(capacity_value_label), capacity);
      - script.execute: refresh_system_ui
      - script.execute: refresh_status_indicators

  - id: refresh_system_ui
    mode: restart
    then:
      - lambda: |-
          const size_t internal_free = heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
          const size_t internal_total = heap_caps_get_total_size(MALLOC_CAP_INTERNAL);
          const size_t psram_free = heap_caps_get_free_size(MALLOC_CAP_SPIRAM);
          const size_t psram_total = heap_caps_get_total_size(MALLOC_CAP_SPIRAM);
          uint32_t flash_total = 0;
          esp_flash_get_size(nullptr, &flash_total);
          const esp_partition_t *running = esp_ota_get_running_partition();
          const size_t app_partition = running == nullptr ? 0 : running->size;
          if (running != nullptr && id(firmware_image_size) == 0) {
            const esp_partition_pos_t part = {running->address, running->size};
            esp_image_metadata_t metadata = {};
            if (esp_image_verify(ESP_IMAGE_VERIFY_SILENT, &part, &metadata) == ESP_OK) {
              id(firmware_image_size) = metadata.image_len;
            }
          }
          const float firmware_mb = id(firmware_image_size) / 1048576.0f;
          const float app_partition_mb = app_partition / 1048576.0f;
          const int app_partition_pct = app_partition > 0
              ? static_cast<int>(lroundf(100.0f * id(firmware_image_size) / app_partition)) : 0;
          const char *update_status = id(firmware_update_status).state.empty()
              ? "Checking updates" : id(firmware_update_status).state.c_str();
          char value[320];
          snprintf(value, sizeof(value),
                   "Controller · %s\nCPU: %.0f%%  ·  %d MHz\nRAM: %.0f / %.0f KB free\nPSRAM: %.1f / %.1f MB free\nFirmware: %.1f MB  ·  %d%% of %.1f MB slot\nFlash chip: %.0f MB total",
                   update_status, id(cpu_utilization), (int) (esp_clk_cpu_freq() / 1000000),
                   internal_free / 1024.0f, internal_total / 1024.0f,
                   psram_free / 1048576.0f, psram_total / 1048576.0f,
                   firmware_mb, app_partition_pct, app_partition_mb,
                   flash_total / 1048576.0f);
          lv_label_set_text(id(device_system_label), value);

  - id: refresh_status_indicators
    mode: restart
    then:
      - lambda: |-
          if (id(screen_sleeping) || id(ui_scrolling)) {
            id(status_indicators_dirty) = true;
            return;
          }
          id(status_indicators_dirty) = false;
          const bool enabled = id(user_wifi_enabled).state;
          if (enabled) lv_obj_add_state(id(device_wifi_toggle), LV_STATE_CHECKED);
          else lv_obj_clear_state(id(device_wifi_toggle), LV_STATE_CHECKED);
          const bool connected = wifi::global_wifi_component->is_connected();
          const float rssi = id(wifi_rssi).state;
          int bars = 0;
          if (connected && !isnan(rssi)) {
            bars = rssi >= -58 ? 4 : rssi >= -67 ? 3 : rssi >= -76 ? 2 : 1;
          }
          lv_label_set_text(id(top_wifi_icon), connected ? "\U0000E63E" : "\U0000E648");
          lv_label_set_text(id(settings_header_wifi_icon), connected ? "\U0000E63E" : "\U0000E648");
          lv_label_set_text(id(settings_header_wifi_label), connected ? "Wi-Fi" : (enabled ? "Wait" : "Off"));
          lv_obj_set_style_text_color(id(settings_header_wifi_icon),
                                      lv_color_hex(connected ? 0x54D19A : 0x66707E), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(top_wifi_icon),
                                      lv_color_hex(connected ? 0xF4F6F8 : 0x66707E), LV_PART_MAIN);
          if (!enabled) {
            lv_label_set_text(id(device_wifi_state_label), "Off");
            lv_obj_set_style_text_color(id(device_wifi_state_label), lv_color_hex(0x9CA6B5), LV_PART_MAIN);
            lv_label_set_text(id(device_wifi_label), "Signal unavailable");
            lv_label_set_text(id(device_ip_label), "No IP address");
          } else if (!connected) {
            lv_label_set_text(id(device_wifi_state_label), "Connecting…");
            lv_obj_set_style_text_color(id(device_wifi_state_label), lv_color_hex(0xFFD60A), LV_PART_MAIN);
            lv_label_set_text(id(device_wifi_label), "Signal unavailable");
            lv_label_set_text(id(device_ip_label), "No IP address");
          } else {
            lv_label_set_text(id(device_wifi_state_label), "Connected");
            lv_obj_set_style_text_color(id(device_wifi_state_label), lv_color_hex(0x54D19A), LV_PART_MAIN);
            char signal[40]; snprintf(signal, sizeof(signal), "Signal  ·  %.0f dBm", rssi);
            lv_label_set_text(id(device_wifi_label), signal);
            std::string address = "DHCP  ·  " + id(device_ip).state;
            lv_label_set_text(id(device_ip_label), address.c_str());
          }

          const int pct = std::max(0, std::min(100, id(battery_percent)));
          const int fill_height = std::max(1, (pct * 15 + 50) / 100);
          lv_obj_set_height(id(top_battery_fill), fill_height);
          lv_obj_set_y(id(top_battery_fill), 15 - fill_height);
          if (pct == 0) lv_obj_add_flag(id(top_battery_fill), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_clear_flag(id(top_battery_fill), LV_OBJ_FLAG_HIDDEN);
          char pct_text[12]; snprintf(pct_text, sizeof(pct_text), "%d%%", pct);
          lv_label_set_text(id(top_battery_percent), pct_text);
          lv_label_set_text(id(settings_header_battery_label), pct_text);
          const bool external = id(external_power);
          if (external) lv_obj_clear_flag(id(top_charge_icon), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(top_charge_icon), LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(top_charge_icon));
          lv_obj_set_x(id(top_battery_percent), 15);
          lv_obj_set_width(id(top_battery_percent), 29);
          // iPhone-style system-tray battery: charge level controls the fill,
          // while power source alone controls its color.
          const uint32_t color = external ? 0x34C759 : 0x9CA6B5;
          lv_obj_set_style_bg_color(id(top_battery_fill), lv_color_hex(color), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(top_charge_icon), lv_color_hex(0x34C759), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(settings_header_battery_icon), lv_color_hex(color), LV_PART_MAIN);
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - lambda: |-
                lv_label_set_text(id(device_ha_label), "Connected");
                lv_label_set_text(id(settings_header_ha_label), "HA");
                lv_obj_set_style_text_color(id(settings_header_ha_icon), lv_color_hex(0x54D19A), LV_PART_MAIN);
                lv_obj_set_style_text_color(id(device_ha_label), lv_color_hex(0x54D19A), LV_PART_MAIN);
                lv_obj_set_style_text_color(id(device_ha_icon), lv_color_hex(0x54D19A), LV_PART_MAIN);
          else:
            - lambda: |-
                if (id(ha_recovery_active)) {
                  lv_label_set_text(id(device_ha_label), "Retrying");
                  lv_label_set_text(id(settings_header_ha_label), "HA…");
                  lv_obj_set_style_text_color(id(settings_header_ha_icon), lv_color_hex(0xFFD60A), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(device_ha_label), lv_color_hex(0xFFD60A), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(device_ha_icon), lv_color_hex(0xFFD60A), LV_PART_MAIN);
                } else {
                  lv_label_set_text(id(device_ha_label), "Waiting");
                  lv_label_set_text(id(settings_header_ha_label), "HA");
                  lv_obj_set_style_text_color(id(settings_header_ha_icon), lv_color_hex(0x66707E), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(device_ha_label), lv_color_hex(0x9CA6B5), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(device_ha_icon), lv_color_hex(0x66707E), LV_PART_MAIN);
                }

  - id: refresh_resume_state
    mode: restart
    then:
      - lambda: |-
          const std::string source = id(media_source_detail).state;
          const bool youtube = source == "youtube" || source == "video";
          const bool ended = youtube && id(duration_seconds) > 0 && id(progress_percent) >= 99;
          lv_label_set_text(id(resume_context_label), ended ? "WATCHED" : "LAST PLAYED");
          lv_label_set_text(id(idle_play_text), ended ? "Restart" : "Resume");
          lv_label_set_text(id(idle_play_icon), ended ? "\U0000E042" : "\U0000E037");
          lv_label_set_text(id(music_resume_text), ended ? "Restart" : "Resume");
          lv_label_set_text(id(music_resume_icon), ended ? "\U0000E042" : "\U0000E037");
          lv_label_set_text(id(video_resume_text), ended ? "Restart" : "Resume");
          lv_label_set_text(id(video_resume_icon), ended ? "\U0000E042" : "\U0000E037");
          const bool idle = id(media_mode) == 0;
          const bool active_mac_available = id(mac_mini_awake).state || id(work_mac_awake).state;
          if (idle && active_mac_available && !id(media_is_video))
            lv_obj_clear_flag(id(music_resume_button), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(music_resume_button), LV_OBJ_FLAG_HIDDEN);
          if (idle && active_mac_available && id(media_is_video))
          {
            lv_obj_add_flag(id(video_next_tab_button), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(video_context_button), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(video_resume_button), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(video_paused_next_button), LV_OBJ_FLAG_HIDDEN);
            lv_obj_move_foreground(id(video_resume_button));
            lv_obj_move_foreground(id(video_paused_next_button));
          }
          else {
            lv_obj_clear_flag(id(video_next_tab_button), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(video_context_button), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(video_resume_button), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(video_paused_next_button), LV_OBJ_FLAG_HIDDEN);
          }
          lv_obj_add_flag(id(resume_card), LV_OBJ_FLAG_HIDDEN);

  - id: resume_or_restart
    mode: restart
    then:
      - lvgl.label.update: { id: idle_play_icon, text: "\U0000F137" }
      - lvgl.label.update: { id: music_resume_icon, text: "\U0000F137" }
      - lvgl.label.update: { id: video_resume_icon, text: "\U0000F137" }
      - if:
          condition:
            lambda: |-
              const std::string source = id(media_source_detail).state;
              return source == "youtube" || source == "video";
          then:
            - homeassistant.action: { action: script.play_youtube }
          else:
            - homeassistant.action:
                action: script.resume_last_playback
                data:
                  source_device: !lambda 'return id(last_source_device);'

  - id: refresh_device_settings
    mode: restart
    then:
      - lambda: |-
          char value[48];
          const int brightness = std::max(5, std::min(100, (int) lroundf(id(display_brightness).state)));
          lv_slider_set_value(id(brightness_slider), brightness, LV_ANIM_OFF);
          snprintf(value, sizeof(value), "%d%%", brightness);
          lv_label_set_text(id(brightness_value_label), value);

          const int screen_seconds = std::max(15, std::min(1800, (int) lroundf(id(screen_timeout).state)));
          const int screen_choices[]={15,30,45,60,120,300,600,1800}; int screen_index=0;
          for(int i=1;i<8;i++) if(abs(screen_seconds-screen_choices[i])<abs(screen_seconds-screen_choices[screen_index])) screen_index=i;
          lv_slider_set_value(id(screen_timeout_slider), screen_index, LV_ANIM_OFF);
          if (screen_seconds < 60) snprintf(value, sizeof(value), "%d sec", screen_seconds);
          else snprintf(value, sizeof(value), "%d min", screen_seconds / 60);
          lv_label_set_text(id(screen_sleep_value_label), value);

          const int device_seconds = std::max(30, std::min(3600, (int) lroundf(id(device_sleep_delay).state)));
          const int device_choices[]={30,60,120,300,600,900,1800,3600}; int device_index=0;
          for(int i=1;i<8;i++) if(abs(device_seconds-device_choices[i])<abs(device_seconds-device_choices[device_index])) device_index=i;
          lv_slider_set_value(id(device_sleep_slider), device_index, LV_ANIM_OFF);
          if (device_seconds < 60) snprintf(value, sizeof(value), "%d sec", device_seconds);
          else snprintf(value, sizeof(value), "%d min", device_seconds / 60);
          lv_label_set_text(id(device_sleep_value_label), value);

          static const char *depth_names[] = {"Display only", "Eco", "Deep"};
          const int depth=std::max(0, std::min(2, id(sleep_depth)));
          lv_label_set_text(id(sleep_depth_value_label), depth_names[depth]);
          lv_slider_set_value(id(sleep_depth_picker), depth, LV_ANIM_OFF);
          const int key_mode=std::max(0, std::min(4, id(control_mode)));
          lv_label_set_text(id(key_mode_value_label),
                            key_mode == 0 ? "Track" : key_mode == 1 ? "Volume" :
                            key_mode == 2 ? "Seek" : key_mode == 3 ? "Pages" : "Brightness");

          if (id(wake_on_touch).state) lv_obj_add_state(id(wake_touch_toggle), LV_STATE_CHECKED);
          else lv_obj_clear_state(id(wake_touch_toggle), LV_STATE_CHECKED);
          lv_slider_set_value(id(haptic_profile_picker), std::max(0, std::min(4, id(haptic_profile))), LV_ANIM_OFF);
          const char *haptic_names[]={"Off","Crisp","Strong","Very Strong","Maximum"};
          lv_label_set_text(id(haptic_value_label), haptic_names[std::max(0,std::min(4,id(haptic_profile)))]);
          if (id(stay_on_external_power).state) lv_obj_add_state(id(external_power_stay_on_toggle), LV_STATE_CHECKED);
          else lv_obj_clear_state(id(external_power_stay_on_toggle), LV_STATE_CHECKED);
          if (id(stay_on_media_playing).state) lv_obj_add_state(id(media_playing_stay_on_toggle), LV_STATE_CHECKED);
          else lv_obj_clear_state(id(media_playing_stay_on_toggle), LV_STATE_CHECKED);

  - id: refresh_nav
    mode: restart
    then:
      - lambda: |-
          const int page = std::max(0, std::min(3, id(current_page)));
          const std::string source = id(media_source_detail).state;
          const char *page_title = "IDLE";
          if (page == 1) page_title = "YOUTUBE UP NEXT";
          else if (page == 2) page_title = "QUICK ACTIONS";
          else if (page == 3) page_title = "SETTINGS";
          else if (id(media_mode) != 0 && id(media_is_video))
            page_title = source == "vlc" ? "VLC" : (source == "youtube" ? "YOUTUBE" : "VIDEO");
          else if (id(media_mode) != 0) page_title = "MUSIC";
          if (!id(startup_state_ready) && !id(startup_settings_open))
            page_title = "STARTING...";
          else if (!id(ha_api_ready))
            page_title = id(ha_recovery_active) ? "RECONNECTING..." : "CONNECTING...";
          lv_label_set_text(id(media_kind_label), page_title);
          lv_obj_set_style_text_font(id(media_kind_label), id(font_caption), LV_PART_MAIN);
          id(refresh_playback_status_icon).execute();
          const bool has_queue = true;  // Both source choices remain reachable when empty.
          lv_label_set_text(id(dock_media_icon), id(media_mode) == 0 ? "\U0000E8B5" :
                                                    (id(media_is_video) ? "\U0000F06A" : "\U0000E405"));
          lv_obj_t *items[4] = {id(dock_media_button), id(dock_video_button),
                                id(dock_quick_button), id(dock_device_button)};
          const int target_pages[4] = {0, 1, 2, 3};
          int sequence[4]; int count=0;
          sequence[count++]=0;
          if (has_queue) sequence[count++]=1;
          sequence[count++]=2; sequence[count++]=3;
          int current_pos=0;
          for(int i=0;i<count;i++) if(target_pages[sequence[i]]==page) current_pos=i;
          for(auto *item:items) lv_obj_add_flag(item, LV_OBJ_FLAG_HIDDEN);
          const int xs[3]={107,157,207}; const int widths[3]={42,46,42};
          for(int visual=0;visual<3;visual++) {
            const int offset=visual-1;
            const int slot=sequence[(current_pos+offset+count)%count];
            lv_obj_t *item=items[slot];
            lv_obj_clear_flag(item, LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_x(item,xs[visual]); lv_obj_set_y(item,visual==1?7:10);
            lv_obj_set_width(item,widths[visual]); lv_obj_set_height(item,visual==1?46:42);
            lv_obj_set_ext_click_area(item, 5);
            lv_obj_set_style_radius(item, LV_RADIUS_CIRCLE, LV_PART_MAIN);
            lv_obj_set_style_bg_opa(item, visual==1 ? LV_OPA_COVER : LV_OPA_80, LV_PART_MAIN);
            const bool selected=visual==1;
            lv_obj_set_style_bg_color(item,lv_color_hex(selected?0x6E2325:0x151A22),LV_PART_MAIN);
            lv_obj_set_style_border_color(item,lv_color_hex(selected?0xEF4038:0x343D4B),LV_PART_MAIN);
            lv_obj_set_style_border_width(item,selected?2:1,LV_PART_MAIN);
          }

  - id: refresh_control_mode
    mode: restart
    then:
      - lambda: |-
          static const char *names[] = {"Track", "Volume", "Seek", "Pages", "Brightness"};
          const int mode=std::max(0, std::min(4, id(control_mode)));
          lv_label_set_text(id(key_mode_value_label), names[mode]);
          lv_label_set_text(id(music_mode_value_label), names[mode]);
          lv_label_set_text(id(video_mode_value_label), names[mode]);
          lv_slider_set_value(id(key_control_mode_picker), mode, LV_ANIM_OFF);
          lv_slider_set_value(id(music_control_mode_picker), mode, LV_ANIM_OFF);
          lv_slider_set_value(id(video_control_mode_picker), mode, LV_ANIM_OFF);

  - id: select_radial_mode
    mode: restart
    parameters:
      mode: int
    then:
      - lambda: 'id(control_mode_candidate) = std::max(0, std::min(4, mode));'
      - script.execute: refresh_radial_selector

  - id: refresh_radial_selector
    mode: restart
    then:
      - lambda: |-
          const int selected = std::max(0, std::min(4, id(control_mode_candidate)));
          lv_obj_t *arcs[5] = {id(mode_arc_track), id(mode_arc_volume), id(mode_arc_seek),
                               id(mode_arc_pages), id(mode_arc_brightness)};
          lv_obj_t *icons[5] = {id(mode_icon_track), id(mode_icon_volume), id(mode_icon_seek),
                                id(mode_icon_pages), id(mode_icon_brightness)};
          lv_obj_t *labels[5] = {id(mode_label_track), id(mode_label_volume), id(mode_label_seek),
                                 id(mode_label_pages), id(mode_label_brightness)};
          static const char *names[5] = {"Track", "Volume", "Seek", "Pages", "Brightness"};
          static const char *details[5] = {"Previous / next", "Adjust level", "Back / forward", "", "Adjust display"};
          for (int i=0; i<5; i++) {
            const bool active = i == selected;
            lv_obj_set_style_arc_color(arcs[i], lv_color_hex(active ? 0xEF4038 : 0x202936), LV_PART_MAIN);
            lv_obj_set_style_arc_width(arcs[i], active ? 68 : 56, LV_PART_MAIN);
            lv_obj_set_style_text_color(icons[i], lv_color_hex(active ? 0xF4F6F8 : 0xB8C0CC), LV_PART_MAIN);
            lv_obj_set_style_text_color(labels[i], lv_color_hex(active ? 0xF4F6F8 : 0x9CA6B5), LV_PART_MAIN);
          }
          lv_label_set_text(id(drawer_mode_value_label), names[selected]);
          lv_label_set_text(id(radial_mode_detail), details[selected]);
          if (selected == 3) lv_obj_add_flag(id(radial_mode_detail), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_clear_flag(id(radial_mode_detail), LV_OBJ_FLAG_HIDDEN);

  - id: open_control_mode_drawer
    mode: restart
    then:
      - script.execute: set_cpu_interactive
      - lambda: 'id(last_activity_ms) = millis();'
      - lambda: |-
          id(control_drawer_open) = true;
          id(control_mode_candidate) = std::max(0, std::min(4, id(control_mode)));
          lv_obj_set_y(id(control_mode_overlay), -360);
          lv_obj_clear_flag(id(control_mode_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(control_mode_overlay));
      - script.execute: refresh_radial_selector
      - lambda: |-
          lv_anim_t a; lv_anim_init(&a);
          lv_anim_set_var(&a, id(control_mode_overlay));
          lv_anim_set_values(&a, -360, 0);
          lv_anim_set_duration(&a, 220);
          lv_anim_set_path_cb(&a, lv_anim_path_ease_out);
          lv_anim_set_exec_cb(&a, [](void *obj, int32_t y) { lv_obj_set_y((lv_obj_t *) obj, y); });
          lv_anim_start(&a);

  - id: close_control_mode_drawer
    mode: restart
    then:
      - script.execute: set_cpu_interactive
      - lambda: 'id(last_activity_ms) = millis();'
      - globals.set: { id: control_drawer_open, value: 'false' }
      - lambda: |-
          lv_anim_t a; lv_anim_init(&a);
          lv_anim_set_var(&a, id(control_mode_overlay));
          lv_anim_set_values(&a, lv_obj_get_y(id(control_mode_overlay)), -360);
          lv_anim_set_duration(&a, 190);
          lv_anim_set_path_cb(&a, lv_anim_path_ease_in);
          lv_anim_set_exec_cb(&a, [](void *obj, int32_t y) { lv_obj_set_y((lv_obj_t *) obj, y); });
          lv_anim_start(&a);
      - delay: 200ms
      - lvgl.widget.hide: control_mode_overlay
      - lambda: 'lv_obj_set_y(id(control_mode_overlay), 0);'

  - id: commit_radial_mode
    mode: restart
    then:
      - lambda: 'id(control_mode) = std::max(0, std::min(4, id(control_mode_candidate)));'
      - script.execute: refresh_control_mode
      - script.execute: close_control_mode_drawer

  - id: reset_page_scroll
    mode: restart
    then:
      - lambda: |-
          // Pages should always reopen from their first control. Reset both the
          // outer page scrollers and the independently scrollable detail cards.
          lv_obj_scroll_to_y(id(music_root), 0, LV_ANIM_OFF);
          lv_obj_scroll_to_y(id(idle_root), 0, LV_ANIM_OFF);
          lv_obj_scroll_to_y(id(video_scroll_root), 0, LV_ANIM_OFF);
          lv_obj_scroll_to_y(id(music_summary_card), 0, LV_ANIM_OFF);
          lv_obj_scroll_to_y(id(video_description_card), 0, LV_ANIM_OFF);
          lv_obj_scroll_to_y(id(queue_scroller), 0, LV_ANIM_OFF);
          lv_obj_scroll_to_y(id(settings_scroller), 0, LV_ANIM_OFF);
          lv_obj_scroll_to_y(id(quick_actions_scroller), 0, LV_ANIM_OFF);

  - id: scroll_current_page_half
    mode: restart
    then:
      - lambda: |-
          // GPIO0 is the usable middle hardware key between Reset and Power.
          // A hold advances the active scroll container by half its viewport.
          lv_obj_t *target = nullptr;
          int32_t distance = 73;
          if (id(current_page) == 0)
            target = id(media_is_video) ? id(video_scroll_root) : id(music_root);
          else if (id(current_page) == 1)
            target = id(queue_scroller);
          else if (id(current_page) == 3) {
            target = id(settings_scroller);
            distance = 137;
          }
          if (target != nullptr)
            lv_obj_scroll_to_y(target, lv_obj_get_scroll_y(target) + distance, LV_ANIM_ON);

  - id: suppress_media_scrollbars
    mode: restart
    then:
      - lambda: |-
          lv_obj_t *scrollables[] = {
            id(metadata_card), id(music_root), id(music_summary_card), id(idle_root),
            id(video_scroll_root), id(video_description_card), id(battery_status_container),
            id(top_battery_shell), id(top_battery_fill)
          };
          for (auto *obj : scrollables) {
            lv_obj_set_scrollbar_mode(obj, LV_SCROLLBAR_MODE_OFF);
            lv_obj_set_style_bg_opa(obj, LV_OPA_TRANSP, LV_PART_SCROLLBAR);
            lv_obj_set_style_border_width(obj, 0, LV_PART_SCROLLBAR);
          }
          lv_obj_clear_flag(id(metadata_card), LV_OBJ_FLAG_SCROLLABLE);
          lv_obj_clear_flag(id(battery_status_container), LV_OBJ_FLAG_SCROLLABLE);
          lv_obj_clear_flag(id(top_battery_shell), LV_OBJ_FLAG_SCROLLABLE);
          lv_obj_clear_flag(id(top_battery_fill), LV_OBJ_FLAG_SCROLLABLE);

  - id: cycle_control_mode
    mode: restart
    then:
      - lambda: 'id(control_mode) = (id(control_mode) + 1) % 5;'
      - script.execute: refresh_control_mode

  - id: animate_top_left
    mode: restart
    then:
      - lambda: |-
          lv_obj_t *target = nullptr;
          if (id(control_mode) == 0)
            target = id(media_is_video) ? id(video_back_10_button) : id(music_previous_button);
          else if (id(control_mode) == 1 && !id(media_is_video))
            target = id(music_volume_down_button);
          else if (id(control_mode) == 2 && id(media_is_video))
            target = id(video_back_10_button);
          if (target != nullptr && !lv_obj_has_flag(target, LV_OBJ_FLAG_HIDDEN)) {
            lv_obj_add_state(target, LV_STATE_PRESSED);
            lv_obj_invalidate(target);
          }
      - delay: 120ms
      - lambda: |-
          lv_obj_t *buttons[] = {id(music_previous_button), id(music_volume_down_button),
                                 id(video_back_10_button)};
          for (auto *button : buttons) lv_obj_clear_state(button, LV_STATE_PRESSED);

  - id: animate_top_right
    mode: restart
    then:
      - lambda: |-
          lv_obj_t *target = nullptr;
          if (id(control_mode) == 0)
            target = id(media_is_video) ? id(video_next_tab_button) : id(music_next_button);
          else if (id(control_mode) == 1 && !id(media_is_video))
            target = id(music_volume_up_button);
          else if (id(control_mode) == 2 && id(media_is_video))
            target = id(video_forward_10_button);
          if (target != nullptr && !lv_obj_has_flag(target, LV_OBJ_FLAG_HIDDEN)) {
            lv_obj_add_state(target, LV_STATE_PRESSED);
            lv_obj_invalidate(target);
          }
      - delay: 120ms
      - lambda: |-
          lv_obj_t *buttons[] = {id(music_next_button), id(music_volume_up_button),
                                 id(video_next_tab_button), id(video_forward_10_button)};
          for (auto *button : buttons) lv_obj_clear_state(button, LV_STATE_PRESSED);

  - id: show_rotary_action_feedback
    mode: restart
    parameters:
      direction: int
    then:
      - lambda: |-
          const int mode = std::max(0, std::min(4, id(control_mode)));
          // Page changes already have immediate feedback in the persistent dock.
          if (mode == 3) {
            lv_obj_add_flag(id(rotary_feedback_overlay), LV_OBJ_FLAG_HIDDEN);
            return;
          }
          const uint32_t now = millis();
          if (mode != id(rotary_feedback_mode) ||
              now - id(rotary_feedback_last_ms) > 1200U)
            id(rotary_feedback_delta) = 0;
          id(rotary_feedback_mode) = mode;
          id(rotary_feedback_last_ms) = now;

          char primary[48];
          char detail[48];
          const char *title = "";
          if (mode == 0) {
            title = direction < 0 ? "Previous track" : "Next track";
            snprintf(primary, sizeof(primary), "%s", direction < 0 ? "|<<" : ">>|");
            snprintf(detail, sizeof(detail), "Track");
          } else if (mode == 1) {
            id(rotary_feedback_delta) += direction;
            title = "Volume";
            const int estimate = std::max(0, std::min(100,
                id(volume_percent) + id(rotary_feedback_delta)));
            snprintf(primary, sizeof(primary), "%d%%", estimate);
            snprintf(detail, sizeof(detail), "%+d step%s", id(rotary_feedback_delta),
                     abs(id(rotary_feedback_delta)) == 1 ? "" : "s");
          } else if (mode == 2) {
            id(rotary_feedback_delta) += direction * 10;
            title = "Seek";
            snprintf(primary, sizeof(primary), "%+d sec", id(rotary_feedback_delta));
            snprintf(detail, sizeof(detail), "%s", direction < 0 ? "Back" : "Forward");
          } else if (mode == 3) {
            int pages[4]; int count = 0;
            pages[count++] = 0;
            pages[count++] = 1;  // Queue source selector is always available.
            pages[count++] = 2; pages[count++] = 3;
            int pos = 0;
            for (int i=0; i<count; i++) if (pages[i] == id(current_page)) pos = i;
            const int next = pages[(pos + (direction < 0 ? count-1 : 1)) % count];
            title = "Page";
            const char *names[] = {"Media", "YouTube Up Next", "Quick Actions", "Settings"};
            snprintf(primary, sizeof(primary), "%s", names[next]);
            snprintf(detail, sizeof(detail), "%s", direction < 0 ? "Previous" : "Next");
          } else {
            id(rotary_feedback_delta) += direction * 5;
            title = "Brightness";
            const int estimate = std::max(15, std::min(100,
                (int) lroundf(id(display_brightness).state) + id(rotary_feedback_delta)));
            snprintf(primary, sizeof(primary), "%d%%", estimate);
            snprintf(detail, sizeof(detail), "%+d", id(rotary_feedback_delta));
          }
          lv_label_set_text(id(rotary_feedback_title), title);
          lv_label_set_text(id(rotary_feedback_primary), primary);
          lv_obj_set_style_text_font(id(rotary_feedback_primary),
                                     mode == 3 ? id(font_small) : id(font_title),
                                     LV_PART_MAIN);
          lv_label_set_text(id(rotary_feedback_detail), detail);
          lv_obj_set_style_opa(id(rotary_feedback_overlay), LV_OPA_COVER, LV_PART_MAIN);
          lv_obj_clear_flag(id(rotary_feedback_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(rotary_feedback_overlay));
      - delay: 760ms
      - lambda: 'lv_obj_fade_out(id(rotary_feedback_overlay), 220, 0);'
      - delay: 240ms
      - lvgl.widget.hide: rotary_feedback_overlay
      - lambda: 'id(rotary_feedback_delta) = 0;'

  - id: control_left
    mode: queued
    then:
      - script.execute: set_cpu_interactive
      - lambda: 'id(last_activity_ms) = millis();'
      - script.execute: animate_top_left
      - script.execute:
          id: show_rotary_action_feedback
          direction: -1
      - if:
          condition: { lambda: 'return id(control_mode) == 0;' }
          then: [ { script.execute: previous_context } ]
          else:
            - if:
                condition: { lambda: 'return id(control_mode) == 1;' }
                then: [ { homeassistant.action: { action: script.volume_down } } ]
                else:
                  - if:
                      condition: { lambda: 'return id(control_mode) == 2;' }
                      then: [ { homeassistant.action: { action: script.skip_back_10s } } ]
                      else:
                        - if:
                            condition: { lambda: 'return id(control_mode) == 3;' }
                            then: [ { script.execute: page_previous } ]
                            else:
                              - number.set:
                                  id: display_brightness
                                  value: !lambda 'return std::max(5.0f, id(display_brightness).state - 5.0f);'

  - id: control_right
    mode: queued
    then:
      - script.execute: set_cpu_interactive
      - lambda: 'id(last_activity_ms) = millis();'
      - script.execute: animate_top_right
      - script.execute:
          id: show_rotary_action_feedback
          direction: 1
      - if:
          condition: { lambda: 'return id(control_mode) == 0;' }
          then: [ { script.execute: next_context } ]
          else:
            - if:
                condition: { lambda: 'return id(control_mode) == 1;' }
                then: [ { homeassistant.action: { action: script.volume_up } } ]
                else:
                  - if:
                      condition: { lambda: 'return id(control_mode) == 2;' }
                      then: [ { homeassistant.action: { action: script.skip_forward_10s } } ]
                      else:
                        - if:
                            condition: { lambda: 'return id(control_mode) == 3;' }
                            then: [ { script.execute: page_next } ]
                            else:
                              - number.set:
                                  id: display_brightness
                                  value: !lambda 'return std::min(100.0f, id(display_brightness).state + 5.0f);'

  - id: refresh_music_extras
    mode: restart
    then:
      - lambda: |-
          const bool has_next = !id(music_next_track_text).empty() &&
                                id(music_next_track_text) != "unknown" &&
                                id(music_next_track_text) != "unavailable";
          lv_label_set_text(id(music_up_next_label), id(music_next_track_text).c_str());

          lv_obj_clear_state(id(music_shuffle_button), LV_STATE_DISABLED);
          lv_obj_set_style_opa(id(music_shuffle_button), LV_OPA_COVER, LV_PART_MAIN);
          if (!id(music_shuffle_available)) {
            lv_label_set_text(id(music_shuffle_icon), "\U000F0768");
            lv_obj_set_style_text_color(id(music_shuffle_icon), lv_color_hex(0xEF4038), LV_PART_MAIN);
            lv_obj_set_style_border_color(id(music_shuffle_button), lv_color_hex(0x343D4B), LV_PART_MAIN);
          } else {
            lv_label_set_text(id(music_shuffle_icon), "\U000F049D");
            lv_obj_set_style_text_color(id(music_shuffle_icon),
                lv_color_hex(id(music_shuffle_enabled) ? 0xEF4038 : 0xF4F6F8), LV_PART_MAIN);
            lv_obj_set_style_border_color(id(music_shuffle_button),
                lv_color_hex(id(music_shuffle_enabled) ? 0xEF4038 : 0x343D4B), LV_PART_MAIN);
          }

          if (id(detail_expanded)) {
            lv_obj_add_flag(id(music_up_next_card), LV_OBJ_FLAG_HIDDEN);
            return;
          }
          lv_obj_add_flag(id(music_button_mode_card), LV_OBJ_FLAG_HIDDEN);
          if (has_next) {
            lv_obj_clear_flag(id(music_up_next_card), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_y(id(music_summary_card), 240);
          } else {
            lv_obj_add_flag(id(music_up_next_card), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_y(id(music_summary_card), 171);
          }

  - id: toggle_detail_view
    mode: restart
    then:
      - lambda: |-
          id(detail_expanded) = !id(detail_expanded);
          // A header tap always lands the revealed detail at its beginning.
          // Collapsing likewise returns the media page to its top, even when
          // the user had scrolled to the end of a long description.
          lv_obj_scroll_to_y(id(music_root), 0, LV_ANIM_OFF);
          lv_obj_scroll_to_y(id(video_scroll_root), 0, LV_ANIM_OFF);
          lv_obj_scroll_to_y(id(music_summary_card), 0, LV_ANIM_OFF);
          lv_obj_scroll_to_y(id(video_description_card), 0, LV_ANIM_OFF);
          if (id(media_is_video)) {
            if (id(detail_expanded)) {
              lv_obj_add_flag(id(video_controls), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(video_button_mode_card), LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(id(video_description_card), LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_y(id(video_description_card), 3);
              lv_obj_set_height(id(video_description_card), 376);
            } else {
              lv_obj_clear_flag(id(video_controls), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(video_button_mode_card), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(video_description_card), LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_y(id(video_description_card), 232);
              lv_obj_set_height(id(video_description_card), 216);
            }
          } else {
            if (id(detail_expanded)) {
              lv_obj_add_flag(id(music_controls), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(music_button_mode_card), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(music_up_next_card), LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(id(music_summary_card), LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_y(id(music_summary_card), 3);
              lv_obj_set_height(id(music_summary_card), 376);
            } else {
              lv_obj_clear_flag(id(music_controls), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(music_button_mode_card), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(music_summary_card), LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_height(id(music_summary_card), 224);
              id(refresh_music_extras).execute();
            }
          }

  - id: media_header_pressed
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(current_page) == 0;
          then:
            - script.execute: toggle_detail_view
          else:
            - lambda: 'id(current_page) = 0;'
            - script.execute: refresh_nav
            - if:
                condition: { lambda: 'return id(media_is_video);' }
                then:
                  - lvgl.page.show: { id: tools_page, animation: FADE_IN, time: 90ms }
                else:
                  - lvgl.page.show: { id: now_page, animation: FADE_IN, time: 90ms }

  - id: show_active_media_when_idle
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(startup_state_ready) && id(media_is_playing) &&
                     (id(media_page_switch_pending) || id(current_page) != 0) &&
                     millis() - id(last_activity_ms) >= 10000U &&
                     !id(control_drawer_open);
          then:
            - lambda: |-
                id(media_page_switch_pending) = false;
                id(current_page) = 0;
            - if:
                condition: { lambda: 'return id(media_is_video);' }
                then:
                  - lvgl.page.show: { id: tools_page, animation: FADE_IN, time: 90ms }
                else:
                  - lvgl.page.show: { id: now_page, animation: FADE_IN, time: 90ms }
            - script.execute: refresh_nav

  - id: refresh_media_layout
    mode: restart
    then:
      - lambda: |-
          const bool user_active = millis() - id(last_activity_ms) < 10000U;
          if (!user_active) id(detail_expanded) = false;
          if (id(media_is_playing) &&
              (id(current_page) != 0 || id(displayed_media_is_video) != id(media_is_video))) {
            id(media_page_switch_pending) = true;
          } else if (!id(media_is_playing)) {
            id(media_page_switch_pending) = false;
          }
          lv_obj_set_style_text_font(id(media_title_label), id(font_small), LV_PART_MAIN);
          id(layout_media_title).execute();
          lv_obj_clear_flag(id(music_controls), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(music_button_mode_card), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(music_summary_card), LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_height(id(music_summary_card), 224);
          lv_obj_clear_flag(id(video_controls), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(video_button_mode_card), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(video_description_card), LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_y(id(video_description_card), 232);
          lv_obj_set_height(id(video_description_card), 216);
      - script.execute: refresh_music_extras
      - script.execute: show_active_media_when_idle
      - lvgl.widget.show: music_root
      - lvgl.widget.hide: idle_root
      - script.execute: refresh_resume_state
      - script.execute: refresh_nav

  - id: render_play_state
    mode: restart
    then:
      - lvgl.label.update:
          id: play_icon
          text: !lambda |-
            if (id(command_pending)) return std::string("\U0000F137");
            return std::string(id(media_is_playing) ? "\U0000E034" : "\U0000E037");
      - lvgl.label.update:
          id: tools_play_icon
          text: !lambda |-
            if (id(command_pending)) return std::string("\U0000F137");
            return std::string(id(media_is_playing) ? "\U0000E034" : "\U0000E037");
      - lvgl.label.update:
          id: idle_play_icon
          text: !lambda |-
            if (id(command_pending)) return std::string("\U0000F137");
            return std::string("\U0000E037");
      - if:
          condition:
            lambda: 'return !id(command_pending);'
          then:
            - lvgl.widget.update: { id: play_button, bg_color: 0x251B1F }
            - lvgl.widget.update: { id: tools_play_button, bg_color: 0x251B1F }
            - lvgl.widget.update: { id: idle_play_button, bg_color: 0x251B1F }

  - id: show_media_command_feedback
    mode: restart
    parameters:
      message: string
      detail: string
      command_mode: int
    then:
      - lambda: |-
          id(media_command_feedback_mode) = command_mode;
          id(media_command_feedback_started_ms) = millis();
          id(media_command_feedback_title) = id(media_title).state;
          lv_label_set_text(id(media_artist_label), message.c_str());
          lv_label_set_text(id(media_album_label), detail.c_str());
          lv_obj_set_style_text_color(id(media_artist_label), lv_color_hex(0xEF4038), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(media_album_label), lv_color_hex(0xB8C0CC), LV_PART_MAIN);
          id(network_activity_until_ms) = millis() + 1200U;
          lv_obj_clear_flag(id(top_network_activity), LV_OBJ_FLAG_HIDDEN);

  - id: previous_context
    then:
      - script.execute:
          id: show_media_command_feedback
          message: "Previous track…"
          detail: "Command sent · refreshing"
          command_mode: 1
      - if:
          condition:
            lambda: 'return id(media_is_video);'
          then:
            - homeassistant.action: { action: script.skip_back_10s }
          else:
            - homeassistant.action: { action: script.previous_song }

  - id: next_context
    then:
      - if:
          condition:
            lambda: 'return id(media_is_video);'
          then:
            - script.execute: next_video_action
          else:
            - script.execute:
                id: show_media_command_feedback
                message: "Next track…"
                detail: "Command sent · refreshing"
                command_mode: 2
            - homeassistant.action: { action: script.next_song }

  - id: next_video_action
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(ha_api_ready);'
          then:
            - script.execute:
                id: show_media_command_feedback
                message: "Next video…"
                detail: "Command sent · refreshing"
                command_mode: 2
            # Launch without waiting for the queue/routing script to finish.
            # This avoids dropping the LVGL callback while HA selects the tab.
            - homeassistant.action:
                action: script.turn_on
                data:
                  entity_id: script.skip_to_next_youtube_video
          else:
            - script.execute:
                id: show_media_command_feedback
                message: "Home Assistant offline"
                detail: "Reconnect and try again"
                command_mode: 2

  - id: video_context_action
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(youtube_short_active);'
          then:
            - homeassistant.action:
                action: script.nowplaying_send_to_source
                data:
                  trigger: youtube_short_next
          else:
            - homeassistant.action:
                action: script.skip_forward_media
                data:
                  seconds: "30"

  - id: video_primary_next_action
    mode: restart
    then:
      - homeassistant.action: { action: script.skip_forward_10s }

  - id: page_previous
    mode: restart
    then:
      - lambda: |-
          int pages[4] = {0, 2, 3, 0};
          int count = 0;
          pages[count++] = 0;
          pages[count++] = 1;  // Queue source selector is always available.
          pages[count++] = 2;
          pages[count++] = 3;
          int position = 0;
          for (int i = 0; i < count; i++) if (pages[i] == id(current_page)) position = i;
          id(current_page) = pages[(position + count - 1) % count];
      - script.execute: refresh_nav
      - if:
          condition: { lambda: 'return id(current_page) == 0;' }
          then:
            - if:
                condition: { lambda: 'return id(media_is_video);' }
                then: [ { lvgl.page.show: { id: tools_page, animation: MOVE_RIGHT, time: 110ms } } ]
                else: [ { lvgl.page.show: { id: now_page, animation: MOVE_RIGHT, time: 110ms } } ]
      - if:
          condition: { lambda: 'return id(current_page) == 1;' }
          then: [ { lvgl.page.show: { id: queue_page, animation: MOVE_RIGHT, time: 110ms } } ]
      - if:
          condition: { lambda: 'return id(current_page) == 2;' }
          then: [ { lvgl.page.show: { id: more_page, animation: MOVE_RIGHT, time: 110ms } } ]
      - if:
          condition: { lambda: 'return id(current_page) == 3;' }
          then: [ { lvgl.page.show: { id: device_page, animation: MOVE_RIGHT, time: 110ms } } ]

  - id: page_next
    mode: restart
    then:
      - lambda: |-
          int pages[4] = {0, 2, 3, 0};
          int count = 0;
          pages[count++] = 0;
          pages[count++] = 1;  // Queue source selector is always available.
          pages[count++] = 2;
          pages[count++] = 3;
          int position = 0;
          for (int i = 0; i < count; i++) if (pages[i] == id(current_page)) position = i;
          id(current_page) = pages[(position + 1) % count];
      - script.execute: refresh_nav
      - if:
          condition: { lambda: 'return id(current_page) == 0;' }
          then:
            - if:
                condition: { lambda: 'return id(media_is_video);' }
                then: [ { lvgl.page.show: { id: tools_page, animation: MOVE_LEFT, time: 110ms } } ]
                else: [ { lvgl.page.show: { id: now_page, animation: MOVE_LEFT, time: 110ms } } ]
      - if:
          condition: { lambda: 'return id(current_page) == 1;' }
          then: [ { lvgl.page.show: { id: queue_page, animation: MOVE_LEFT, time: 110ms } } ]
      - if:
          condition: { lambda: 'return id(current_page) == 2;' }
          then: [ { lvgl.page.show: { id: more_page, animation: MOVE_LEFT, time: 110ms } } ]
      - if:
          condition: { lambda: 'return id(current_page) == 3;' }
          then: [ { lvgl.page.show: { id: device_page, animation: MOVE_LEFT, time: 110ms } } ]

  - id: resolve_video_conflict
    parameters:
      index: int
    then:
      - lambda: |-
          id(conflict_source).clear();
          id(conflict_browser).clear();
          id(conflict_window).clear();
          id(conflict_tab).clear();
          id(conflict_video_id).clear();
          std::string payload = id(youtube_conflict_json).state;
          if (payload.rfind("json:", 0) == 0) payload.erase(0, 5);
          json::parse_json(payload, [index](JsonObject root) -> bool {
            JsonArray items = root["items"].as<JsonArray>();
            if (index < 0 || index >= (int) items.size()) return false;
            JsonObject item = items[index];
            id(conflict_source) = item["source_device"] | "";
            id(conflict_browser) = item["browser"] | "";
            id(conflict_window) = std::to_string((int) (item["window_index"] | 0));
            id(conflict_tab) = std::to_string((int) (item["tab_index"] | 0));
            id(conflict_video_id) = item["video_id"] | "";
            return true;
          });
          lv_label_set_text(id(conflict_heading), "Keeping selected video…");
      - if:
          condition:
            lambda: |-
              return id(ha_api_ready) && !id(conflict_source).empty() &&
                     !id(conflict_browser).empty() && id(conflict_video_id).size() == 11;
          then:
            - homeassistant.action:
                action: script.resolve_youtube_playback_conflict
                data:
                  source_device: !lambda 'return id(conflict_source);'
                  browser: !lambda 'return id(conflict_browser);'
                  window_index: !lambda 'return id(conflict_window);'
                  tab_index: !lambda 'return id(conflict_tab);'
                  video_id: !lambda 'return id(conflict_video_id);'
          else:
            - lambda: 'lv_label_set_text(id(conflict_heading), "Unable to send selection");'

lvgl:
  rotation: 180
  displays: [amoled_display]
  touchscreens: [controller_touch]
  # ESPHome's 12% setting maps to its 1/8-screen fast internal buffer. The next
  # supported step is a much larger 1/4-screen allocation, which leaves too
  # little internal heap for a stable encrypted API connection on this build.
  buffer_size: 12%
  # LVGL 9 defaults to 16 ms; keep the frame cadence explicit for this UI.
  refresh_interval: 16ms
  bg_color: 0x080B10
  text_font: font_body
