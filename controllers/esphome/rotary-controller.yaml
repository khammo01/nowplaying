  - platform: homeassistant
    id: youtube_queue_json
    entity_id: sensor.now_playing_youtube_queue
    attribute: queue_json
    on_value:
      - lambda: |-
          std::string payload = x;
          if (payload.rfind("json:", 0) == 0) payload.erase(0, 5);
          const bool parsed = json::parse_json(payload, [](JsonObject root) -> bool {
            JsonArray items = root["items"].as<JsonArray>();
            lv_obj_t *buttons[] = {
              id(queue_button_1), id(queue_button_2), id(queue_button_3),
              id(queue_button_4), id(queue_button_5), id(queue_button_6),
              id(queue_button_7), id(queue_button_8), id(queue_button_9),
              id(queue_button_10), id(queue_button_11), id(queue_button_12)
            };
            lv_obj_t *titles[] = {
              id(queue_title_1), id(queue_title_2), id(queue_title_3),
              id(queue_title_4), id(queue_title_5), id(queue_title_6),
              id(queue_title_7), id(queue_title_8), id(queue_title_9),
              id(queue_title_10), id(queue_title_11), id(queue_title_12)
            };
            lv_obj_t *details[] = {
              id(queue_detail_1), id(queue_detail_2), id(queue_detail_3),
              id(queue_detail_4), id(queue_detail_5), id(queue_detail_6),
              id(queue_detail_7), id(queue_detail_8), id(queue_detail_9),
              id(queue_detail_10), id(queue_detail_11), id(queue_detail_12)
            };
            const int count = std::min(12, (int) items.size());
            id(youtube_queue_count) = count;
            const char *source = root["source_device"] | "";
            id(youtube_queue_source) = source;
            lv_obj_set_style_bg_color(id(queue_source_mini_button), lv_color_hex(strcmp(source, "Mac Mini") == 0 ? 0x71302E : 0x18202C), 0);
            lv_obj_set_style_bg_color(id(queue_source_work_button), lv_color_hex(strcmp(source, "Work Mac") == 0 ? 0x71302E : 0x18202C), 0);
            lv_obj_scroll_to_y(id(queue_scroller), 0, LV_ANIM_OFF);
            for (int i = 0; i < 12; i++) {
              if (i >= count) {
                lv_obj_add_flag(buttons[i], LV_OBJ_FLAG_HIDDEN);
                continue;
              }
              lv_obj_clear_flag(buttons[i], LV_OBJ_FLAG_HIDDEN);
              const char *title = items[i]["title"] | "YouTube video";
              const char *author = items[i]["author"] | "YouTube";
              const int duration = items[i]["duration_sec"] | 0;
              char detail[96];
              if (duration >= 3600)
                snprintf(detail, sizeof(detail), "%s  ·  %d:%02d:%02d", author,
                         duration / 3600, (duration % 3600) / 60, duration % 60);
              else if (duration > 0)
                snprintf(detail, sizeof(detail), "%s  ·  %d:%02d", author,
                         duration / 60, duration % 60);
              else
                snprintf(detail, sizeof(detail), "%s", author);
              lv_label_set_text(titles[i], title);
              lv_label_set_text(details[i], detail);
            }
            char heading[64];
            snprintf(heading, sizeof(heading), "YouTube Up Next  ·  %d", count);
            lv_label_set_text(id(queue_count_label), heading);
            char source_text[72];
            snprintf(source_text, sizeof(source_text), "%s%s",
                     source[0] ? "From " : "", source);
            lv_label_set_text(id(queue_source_label), source_text);
            return true;
          });
          if (!parsed) id(youtube_queue_count) = 0;
      - script.execute: refresh_nav

  - platform: homeassistant
    id: youtube_conflict_json
    entity_id: sensor.now_playing_youtube_queue
    attribute: conflict_json
    on_value:
      - lambda: |-
          std::string payload = x;
          if (payload.rfind("json:", 0) == 0) payload.erase(0, 5);
          const bool parsed = json::parse_json(payload, [](JsonObject root) -> bool {
            JsonArray items = root["items"].as<JsonArray>();
            if (items.size() <= 1) {
              lv_obj_add_flag(id(conflict_overlay), LV_OBJ_FLAG_HIDDEN);
              id(conflict_artwork_1).release();
              id(conflict_artwork_2).release();
              id(conflict_thumb_1).clear();
              id(conflict_thumb_2).clear();
              return true;
            }
            lv_obj_clear_flag(id(conflict_overlay), LV_OBJ_FLAG_HIDDEN);
            char heading[72];
            snprintf(heading, sizeof(heading), "%u videos are playing", (unsigned) items.size());
            lv_label_set_text(id(conflict_heading), heading);
            JsonObject first = items[0];
            JsonObject second = items[1];
            lv_label_set_text(id(conflict_title_1), first["title"] | "YouTube video");
            lv_label_set_text(id(conflict_title_2), second["title"] | "YouTube video");
            char detail[112];
            const int d1 = first["duration_sec"] | 0;
            snprintf(detail, sizeof(detail), "%s · %s%s%d:%02d",
                     first["source_device"] | "Mac", first["author"] | "YouTube",
                     d1 ? " · " : "", d1 / 60, d1 % 60);
            lv_label_set_text(id(conflict_detail_1), detail);
            const int d2 = second["duration_sec"] | 0;
            snprintf(detail, sizeof(detail), "%s · %s%s%d:%02d",
                     second["source_device"] | "Mac", second["author"] | "YouTube",
                     d2 ? " · " : "", d2 / 60, d2 % 60);
            lv_label_set_text(id(conflict_detail_2), detail);
            const std::string thumb1 = first["thumbnail_url"] | "";
            const std::string thumb2 = second["thumbnail_url"] | "";
            if (!thumb1.empty() && thumb1 != id(conflict_thumb_1)) {
              id(conflict_thumb_1) = thumb1;
              id(conflict_artwork_1).set_url(thumb1);
              id(conflict_artwork_1).update();
            }
            if (!thumb2.empty() && thumb2 != id(conflict_thumb_2)) {
              id(conflict_thumb_2) = thumb2;
              id(conflict_artwork_2).set_url(thumb2);
              id(conflict_artwork_2).update();
            }
            return true;
          });
          if (!parsed) lv_obj_add_flag(id(conflict_overlay), LV_OBJ_FLAG_HIDDEN);

  - platform: homeassistant
    id: media_genre
    entity_id: sensor.now_playing_metadata
    attribute: genre
    on_value:
      - script.execute: refresh_music_synopsis

  - platform: homeassistant
    id: media_position
    entity_id: sensor.now_playing_metadata
    attribute: current_position
    on_value:
      - lambda: |-
          int h=0,m=0,s=0;
          if (sscanf(x.c_str(), "%d:%d:%d", &h,&m,&s) == 3) {
            id(position_seconds)=h*3600+m*60+s;
          } else if (sscanf(x.c_str(), "%d:%d", &m,&s) == 2) {
            id(position_seconds)=m*60+s;
          } else {
            return;
          }
          id(position_anchor_ms) = millis();
      - script.execute: render_media_time

  - platform: homeassistant
    id: media_duration
    entity_id: sensor.now_playing_metadata
    attribute: duration
    on_value:
      - lambda: |-
          int h=0,m=0,s=0;
          if (sscanf(x.c_str(), "%d:%d:%d", &h,&m,&s) == 3) {
            id(duration_seconds)=h*3600+m*60+s;
          } else if (sscanf(x.c_str(), "%d:%d", &m,&s) == 2) {
            id(duration_seconds)=m*60+s;
          } else {
            id(duration_seconds)=0;
          }
      - script.execute: render_media_time

  - platform: homeassistant
    id: media_summary
    entity_id: sensor.now_playing_metadata
    attribute: display_synopsis
    on_value:
      - lambda: |-
          if (id(video_description_text).empty())
            lv_label_set_text(id(video_description_label),
                              x.empty() ? "No description is available for this video." : x.c_str());
      - script.execute: refresh_music_synopsis

  - platform: homeassistant
    id: media_description
    entity_id: sensor.now_playing_metadata
    attribute: description
    on_value:
      - lambda: |-
          // YouTube descriptions often use decorative Mathematical Alphanumeric
          // Unicode and emoji. The display font intentionally carries readable
          // language glyphs rather than thousands of ornamental variants, so
          // normalize the common styled alphabets and punctuation before render.
          std::string clean;
          clean.reserve(std::min<size_t>(x.size(), 2200));
          const char *p = x.c_str();
          while (*p && clean.size() < 2200) {
            size_t n = 0;
            uint32_t cp = esphome::unicode::extract_unicode_codepoint(p, &n);
            if (n == 0) { p++; continue; }
            char mapped = 0;
            if (cp >= 0x1D400 && cp <= 0x1D419) mapped = 'A' + (cp - 0x1D400);
            else if (cp >= 0x1D41A && cp <= 0x1D433) mapped = 'a' + (cp - 0x1D41A);
            else if (cp >= 0x1D468 && cp <= 0x1D481) mapped = 'A' + (cp - 0x1D468);
            else if (cp >= 0x1D482 && cp <= 0x1D49B) mapped = 'a' + (cp - 0x1D482);
            else if (cp >= 0x1D7CE && cp <= 0x1D7D7) mapped = '0' + (cp - 0x1D7CE);
            else if (cp == 0x2018 || cp == 0x2019) mapped = '\'';
            else if (cp == 0x201C || cp == 0x201D) mapped = '"';
            else if (cp == 0x2013 || cp == 0x2014) mapped = '-';
            else if (cp == 0x25B6) mapped = '>';
            if (mapped) clean.push_back(mapped);
            else if (cp == 0x00A0) clean.push_back(' ');
            else if (cp <= 0x024F || (cp >= 0x3000 && cp <= 0x30FF) ||
                     (cp >= 0x4E00 && cp <= 0x9FFF)) clean.append(p, n);
            // Unsupported emoji, variation selectors, and ornamental symbols
            // are omitted instead of appearing as rows of empty boxes.
            p += n;
          }
          id(video_description_text) = clean;
          const char *value = clean.empty() ? "No description is available for this video." : clean.c_str();
          lv_label_set_text(id(video_description_label), value);
      - script.execute: refresh_music_synopsis

